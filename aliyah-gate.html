<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>פרד״ס העליה</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *{ box-sizing:border-box; }

    html,body{
      min-height:100%;
      margin:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:#071014;
      color:#fff;
      overflow-x:hidden;
    }

    .sea-bg-video{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:0;
      background:#071014;
      transform:scale(1.04);
      pointer-events:none;
    }

    .sea-bg-overlay{
      position:fixed;
      inset:0;
      z-index:1;
      background:rgba(0,0,0,.16);
      pointer-events:none;
    }

    .page{
      position:relative;
      z-index:2;
      min-height:100vh;
      width:min(100%,560px);
      margin:0 auto;
      padding:20px 10px 34px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .gate-card{
      width:100%;
      position:relative;
    }

    .hero-logo{
      width:clamp(150px, 42vw, 225px);
      height:clamp(150px, 42vw, 225px);
      object-fit:cover;
      border-radius:50%;
      display:block;
      margin:0 auto 10px;
      border:2px solid rgba(255,255,255,.76);
      box-shadow:
        0 0 0 4px rgba(80,80,255,.32),
        0 0 34px rgba(255,255,255,.28),
        0 12px 32px rgba(0,0,0,.45);
    }

    .gate-title{
      margin:0 0 6px;
      font-size:clamp(36px, 9vw, 58px);
      font-weight:900;
      color:#fff;
      text-shadow:0 4px 18px rgba(0,0,0,.75);
      line-height:1.05;
    }

    .gate-subtitle{
      margin:0 auto 4px;
      font-size:clamp(17px, 4.5vw, 24px);
      line-height:1.55;
      font-weight:700;
      color:rgba(255,255,255,.96);
      text-shadow:0 3px 14px rgba(0,0,0,.72);
      max-width:430px;
    }

    .pardes-tree-wrap{
      position:relative;
      width:min(100%, 430px);
      height:350px;
      margin:8px auto 14px;
      direction:ltr;
      isolation:isolate;
    }

    .pardes-tree-svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      overflow:visible;
      pointer-events:none;
      filter:drop-shadow(0 10px 18px rgba(0,0,0,.25));
    }

    .pardes-tree-svg .tree-trunk{
      fill:none;
      stroke:rgba(210,175,130,.78);
      stroke-width:16;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .pardes-tree-svg .tree-trunk-light{
      fill:none;
      stroke:rgba(255,255,255,.30);
      stroke-width:4;
      stroke-linecap:round;
    }

    .pardes-tree-svg .tree-branch{
      fill:none;
      stroke:rgba(220,188,145,.68);
      stroke-width:7;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .pardes-tree-svg .tree-branch.thin{
      stroke:rgba(235,215,185,.42);
      stroke-width:3;
    }

    .pardes-tree-svg .tree-leaf{
      fill:rgba(86,185,138,.22);
      stroke:rgba(255,255,255,.26);
      stroke-width:1.3;
    }

    .pardes-tree-svg .tree-leaf-light{
      fill:rgba(255,255,255,.08);
      stroke:rgba(255,255,255,.20);
      stroke-width:1;
    }

    .fruit-link{
      position:absolute;
      z-index:3;
      width:68px;
      height:68px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-decoration:none;
      background:radial-gradient(circle at 35% 25%, rgba(255,255,255,.34), rgba(255,255,255,.08) 42%, rgba(255,255,255,.02) 70%);
      border:1px solid rgba(255,255,255,.48);
      box-shadow:
        0 0 0 6px rgba(255,255,255,.06),
        0 10px 24px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.30);
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
      transition:transform .22s ease, box-shadow .22s ease, background .22s ease;
    }

    .fruit-link:hover{
      transform:translateY(-4px) scale(1.06);
      background:radial-gradient(circle at 35% 25%, rgba(255,255,255,.46), rgba(255,255,255,.12) 42%, rgba(255,255,255,.04) 72%);
      box-shadow:
        0 0 0 8px rgba(255,255,255,.08),
        0 14px 30px rgba(0,0,0,.38),
        0 0 18px rgba(255,255,255,.34),
        inset 0 1px 0 rgba(255,255,255,.38);
    }

    .fruit-link i{
      font-size:34px;
      line-height:1;
      text-shadow:0 4px 12px rgba(0,0,0,.45);
    }

    .fruit-instagram{ left:18px; top:122px; }
    .fruit-facebook{ left:118px; top:56px; }
    .fruit-youtube{ right:118px; top:56px; }
    .fruit-tiktok{ right:18px; top:122px; }
    .fruit-whatsapp{ left:60px; bottom:42px; }
    .fruit-email{ right:60px; bottom:42px; }
    .fruit-instagram i{ color:#E4405F !important; }
    .fruit-facebook i{ color:#1877F2 !important; }
    .fruit-youtube i{ color:#FF0000 !important; }
    .fruit-tiktok i{
      color:#FFFFFF !important;
      filter:drop-shadow(-2px 0 0 #25F4EE) drop-shadow(2px 0 0 #FE2C55);
    }
    .fruit-whatsapp i{ color:#25D366 !important; }
    .fruit-email i{
       color:#FFFFFF !important;
      }

    .fruit-letter{
      position:absolute;
      top:72px;
      left:50%;
      transform:translateX(-50%);
      color:#fff;
      font-size:18px;
      font-weight:900;
      line-height:1;
      text-shadow:0 3px 10px rgba(0,0,0,.85);
      pointer-events:none;
    }

    .secret-admin-hit{
      position:absolute;
      left:8px;
      bottom:8px;
      width:34px;
      height:34px;
      opacity:0;
      z-index:20;
    }

    @media (max-width:420px){

      .page{
        padding:14px 8px 24px;
      }

      .pardes-tree-wrap{
        height:330px;
        width:min(100%, 390px);
        margin-top:4px;
        margin-bottom:12px;
      }

      .fruit-link{
        width:60px;
        height:60px;
      }

      .fruit-link i{
        font-size:30px;
      }

      .fruit-instagram{ left:10px; top:120px; }
      .fruit-facebook{ left:95px; top:54px; }
      .fruit-youtube{ right:95px; top:54px; }
      .fruit-tiktok{ right:10px; top:120px; }
      .fruit-whatsapp{ left:40px; bottom:38px; }
      .fruit-email{ right:40px; bottom:38px; }

      .fruit-link:hover{
        transform:translateY(-4px) scale(1.06);
      }

      .fruit-whatsapp:hover{
        transform:translateX(-50%) translateY(-4px) scale(1.06);
      }

      .fruit-letter{
        top:64px;
        font-size:16px;
      }
    }
  </style>
</head>

<body>

  <video class="sea-bg-video" autoplay muted loop playsinline poster="ocean-poster.jpg">
    <source src="ocean.mp4" type="video/mp4">
  </video>

  <div class="sea-bg-overlay"></div>

  <div class="page">
    <div class="gate-card">

      <img class="hero-logo" src="logo.png" alt="פרשת השבוע" />

      <h1 class="gate-title">הפרדס</h1>

      <div class="gate-subtitle">
        בחרו ענף אחד כדי להעמיק בעלייה זו
      
        <br>
      
        <span class="gate-note">
          להשארת הודעה השתמשו בלחצן הפנייה
        </span>
      </div>

      <div class="pardes-tree-wrap" aria-label="קישורי פרדס העלייה">

        <svg class="pardes-tree-svg" viewBox="0 0 430 350" aria-hidden="true" focusable="false">
          <defs>
            <radialGradient id="treeGlow" cx="50%" cy="45%" r="62%">
              <stop offset="0%" stop-color="rgba(255,255,255,.18)" />
              <stop offset="65%" stop-color="rgba(255,255,255,.04)" />
              <stop offset="100%" stop-color="rgba(255,255,255,0)" />
            </radialGradient>
          </defs>

          <ellipse cx="215" cy="178" rx="198" ry="138" fill="url(#treeGlow)" />

          <g opacity=".95">
            <ellipse class="tree-leaf" cx="82" cy="122" rx="34" ry="20" transform="rotate(-28 82 122)" />
            <ellipse class="tree-leaf" cx="126" cy="75" rx="34" ry="20" transform="rotate(22 126 75)" />
            <ellipse class="tree-leaf" cx="178" cy="54" rx="32" ry="19" transform="rotate(-18 178 54)" />
            <ellipse class="tree-leaf" cx="256" cy="54" rx="32" ry="19" transform="rotate(18 256 54)" />
            <ellipse class="tree-leaf" cx="304" cy="76" rx="34" ry="20" transform="rotate(-22 304 76)" />
            <ellipse class="tree-leaf" cx="362" cy="122" rx="34" ry="20" transform="rotate(28 362 122)" />
            <ellipse class="tree-leaf" cx="96" cy="224" rx="34" ry="20" transform="rotate(24 96 224)" />
            <ellipse class="tree-leaf" cx="336" cy="224" rx="34" ry="20" transform="rotate(-24 336 224)" />
            <ellipse class="tree-leaf-light" cx="215" cy="102" rx="48" ry="26" />
            <ellipse class="tree-leaf-light" cx="215" cy="202" rx="60" ry="32" />
          </g>

          <path class="tree-branch" d="M215 306 C210 242 211 190 214 116" />
          <path class="tree-trunk" d="M215 334 C212 282 213 228 216 172 C218 130 216 94 213 60" />
          <path class="tree-trunk-light" d="M221 326 C220 276 220 222 222 176 C224 132 222 98 220 70" />

          <path class="tree-branch" d="M215 176 C174 151 132 126 78 121" />
          <path class="tree-branch" d="M214 154 C185 122 158 91 137 64" />
          <path class="tree-branch" d="M216 158 C244 121 271 88 296 62" />
          <path class="tree-branch" d="M218 178 C260 151 315 128 372 124" />
          <path class="tree-branch" d="M214 226 C164 209 110 214 72 252" />
          <path class="tree-branch" d="M220 226 C270 208 324 214 360 252" />

          <path class="tree-branch thin" d="M120 112 C102 88 94 70 88 47" />
          <path class="tree-branch thin" d="M151 84 C143 58 148 38 164 19" />
          <path class="tree-branch thin" d="M276 84 C285 58 280 38 263 19" />
          <path class="tree-branch thin" d="M335 114 C352 88 360 70 366 47" />
          <path class="tree-branch thin" d="M112 220 C82 205 58 204 30 214" />
          <path class="tree-branch thin" d="M320 220 C350 205 374 204 402 214" />
        </svg>

        <a id="instagramLink" class="fruit-link fruit-instagram" href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram - דרש">
          <i class="fa-brands fa-instagram"></i>
          <span class="fruit-letter">ד</span>
        </a>

        <a id="facebookLink" class="fruit-link fruit-facebook" href="#" target="_blank" rel="noopener noreferrer" aria-label="Facebook - רמז">
          <i class="fa-brands fa-facebook-f"></i>
          <span class="fruit-letter">ר</span>
        </a>

        <a id="youtubeLink" class="fruit-link fruit-youtube" href="#" target="_blank" rel="noopener noreferrer" aria-label="YouTube - פשט">
          <i class="fa-brands fa-youtube"></i>
          <span class="fruit-letter">פ</span>
        </a>

        <a id="tiktokLink" class="fruit-link fruit-tiktok" href="#" target="_blank" rel="noopener noreferrer" aria-label="TikTok - ראשי">
          <i class="fa-brands fa-tiktok"></i>
          <span class="fruit-letter">ה</span>
        </a>

        <a id="whatsappLink" class="fruit-link fruit-whatsapp" href="#" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp - סוד">
          <i class="fa-brands fa-whatsapp"></i>
          <span class="fruit-letter">ס</span>
        </a>

        <a id="emailLink" class="fruit-link fruit-email"
        href="mailto:prsthsbw9@gmail.com"
        aria-label="Email">
        
          <i class="fa-regular fa-envelope"></i>
        
          <span class="fruit-letter fruit-word">פנייה</span>
        
        </a>        
        
        <a href="secret-admin.html" class="secret-admin-hit" aria-label="כניסה נסתרת לניהול"></a>

      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDtrEyAnVMhCZWnSaUYut9LxNC17C3So1Y",
      authDomain: "parasha-site-links.firebaseapp.com",
      projectId: "parasha-site-links",
      storageBucket: "parasha-site-links.firebasestorage.app",
      messagingSenderId: "799400165769",
      appId: "1:799400165769:web:1b5cf70eee80e772df6158"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadLinks(){
      const docRef = doc(db, "links", "current");
      const docSnap = await getDoc(docRef);

      if(docSnap.exists()){
        const data = docSnap.data();

        document.getElementById("youtubeLink").href = data.youtube || "#";
        document.getElementById("facebookLink").href = data.facebook || "#";
        document.getElementById("instagramLink").href = data.instagram || "#";
        document.getElementById("tiktokLink").href = data.tiktok || "#";
        document.getElementById("whatsappLink").href = data.whatsapp || "#";
      }
    }

    loadLinks();
  </script>

</body>
</html>
