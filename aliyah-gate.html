<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>פרד״ס העליה</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    body{
      margin:0;
      min-height:100vh;
      overflow:hidden;
      font-family:Arial,sans-serif;
      background:#000;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    video.bg-video{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:-2;
    }

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.35);
      z-index:-1;
    }

    .wrap{
      width:min(92%,420px);
      text-align:center;
    }

    h1{
      font-size:34px;
      margin-bottom:12px;
      text-shadow:0 4px 18px rgba(0,0,0,.7);
    }

    .sub{
      font-size:18px;
      line-height:1.7;
      margin-bottom:38px;
      text-shadow:0 2px 10px rgba(0,0,0,.7);
    }

    .icons{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:22px;
      justify-items:center;
    }

    .icon-btn{
      width:78px;
      height:78px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.35);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      box-shadow:
        0 10px 24px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.2);
      transition:.22s ease;
      position:relative;
    }

    .icon-btn:hover{
      transform:translateY(-4px) scale(1.06);
      box-shadow:
        0 14px 34px rgba(0,0,0,.45),
        0 0 18px rgba(255,255,255,.2);
    }

    .icon-btn i{
      font-size:38px;
    }

    .youtube i{ color:#ff0000; }
    .facebook i{ color:#1877f2; }
    .instagram i{ color:#E4405F; }
    .tiktok i{
      color:#fff;
      filter:drop-shadow(-2px 0 0 #25F4EE)
             drop-shadow(2px 0 0 #FE2C55);
    }
    .whatsapp i{ color:#25D366; }

    .letter{
      position:absolute;
      bottom:-28px;
      left:50%;
      transform:translateX(-50%);
      font-size:20px;
      font-weight:900;
      text-shadow:0 3px 12px rgba(0,0,0,.9);
    }

  </style>
</head>

<body>

  <video class="bg-video" autoplay muted loop playsinline>
    <source src="ocean.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="wrap">

    <h1>פרד״ס העליה</h1>

    <div class="sub">
      בחרו אחד מענפי הפרד״ס<br>
      כדי להעמיק בעלייה זו
    </div>

    <div class="icons">

      <a id="youtubeLink" class="icon-btn youtube" href="#">
        <i class="fa-brands fa-youtube"></i>
        <span class="letter">פ</span>
      </a>

      <a id="facebookLink" class="icon-btn facebook" href="#">
        <i class="fa-brands fa-facebook-f"></i>
        <span class="letter">ר</span>
      </a>

      <a id="instagramLink" class="icon-btn instagram" href="#">
        <i class="fa-brands fa-instagram"></i>
        <span class="letter">ד</span>
      </a>

      <a id="tiktokLink" class="icon-btn tiktok" href="#">
        <i class="fa-brands fa-tiktok"></i>
        <span class="letter">ה</span>
      </a>

      <a id="whatsappLink" class="icon-btn whatsapp" href="#">
        <i class="fa-brands fa-whatsapp"></i>
        <span class="letter">ס</span>
      </a>

    </div>

  </div>

</body>
</html>
