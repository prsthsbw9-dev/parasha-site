    function formatGregorianDate(dateValue){
      const date = new Date(dateValue + "T12:00:00");
    
      return date.toLocaleDateString("he-IL", {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      });
    }
    
    function hebrewNumber(num){
      const ones = ["","א","ב","ג","ד","ה","ו","ז","ח","ט"];
      const tens = ["","י","כ","ל","מ","נ","ס","ע","פ","צ"];
      const hundreds = ["","ק","ר","ש","ת"];
    
      let n = Number(num);
    
      if(n >= 5000){
        n = n % 1000;
      }
    
      let result = "";
    
      while(n >= 400){
        result += "ת";
        n -= 400;
      }
    
      if(n >= 100){
        result += hundreds[Math.floor(n / 100)];
        n = n % 100;
      }
    
      if(n === 15){
        result += "טו";
      }else if(n === 16){
        result += "טז";
      }else{
        result += tens[Math.floor(n / 10)];
        result += ones[n % 10];
      }
    
      if(result.length === 1){
        return result + "׳";
      }
    
      return result.slice(0,-1) + "״" + result.slice(-1);
    }

    function formatHebrewYearLabel(year){
    return "ה" + hebrewNumber(year);

  function populateHebrewYearSelect(){
    const hebrewYearSelect = document.getElementById("hebrewYear");
  
    if(!hebrewYearSelect){
      return;
    }
  
    const startYear = 5795;
    const endYear = 5600;
  
    for(let year = startYear; year >= endYear; year--){
      const option = document.createElement("option");
  
      option.value = String(year);
      option.textContent = formatHebrewYearLabel(year);
  
      hebrewYearSelect.appendChild(option);
    }
  }

    function formatHebrewDate(dateValue){
      const date = new Date(dateValue + "T12:00:00");
    
      const parts = new Intl.DateTimeFormat("he-u-ca-hebrew", {
        day:"numeric",
        month:"long",
        year:"numeric"
      }).formatToParts(date);
    
      const day = parts.find(part => part.type === "day")?.value || "";
      const month = parts.find(part => part.type === "month")?.value || "";
      const year = parts.find(part => part.type === "year" || part.type === "relatedYear")?.value || "";
    
      return `${hebrewNumber(day)} ב${month} ${hebrewNumber(year)}`;
    }

    function formatHebrewDateWithYearNumber(data){
      const hebrewDay = data.hebcalInfo?.hebrewDay;
      const hebrewYear = data.hebcalInfo?.hebrewYear;
      const hebrewMonth = getHebrewMonthName(data.birthDate);
    
      if(!hebrewDay || !hebrewYear || !hebrewMonth){
        return formatHebrewDate(data.birthDate);
      }
    
      return `${hebrewNumber(hebrewDay)} ב${hebrewMonth} ה${hebrewNumber(hebrewYear)}   |   ${hebrewYear}`;
    }    

    function getWeekdayHebrew(dateValue){
      const date = new Date(dateValue + "T12:00:00");
    
      return date.toLocaleDateString("he-IL", {
        weekday:"long"
      });
    }
    
    function getHebrewMonthName(dateValue){
      const date = new Date(dateValue + "T12:00:00");
    
      const parts = new Intl.DateTimeFormat("he-u-ca-hebrew", {
        month:"long"
      }).formatToParts(date);
    
      const monthPart = parts.find(part => part.type === "month");
    
      return monthPart ? monthPart.value : "";
    }
    
    function getMazalByHebrewMonth(hebrewMonth){
      const map = {

    async function getHebcalDateInfo(dateValue){
      const url = `https://www.hebcal.com/converter?cfg=json&date=${dateValue}&g2h=1&strict=1`;

      const data = await response.json();
    
      return {
        hebrewDate: data.hebrew,
        hebrewDay: data.hd,
        hebrewMonth: data.hm,
        hebrewYear: data.hy
      };
    }

    async function getBarBatMitzvahInfo(dateValue, gender){
      const birthInfo = await getHebcalDateInfo(dateValue);
    
      const mitzvahYear =
        gender === "female"
          ? birthInfo.hebrewYear + 12
          : birthInfo.hebrewYear + 13;
    
      const url = `https://www.hebcal.com/converter?cfg=json&h2g=1&hd=${birthInfo.hebrewDay}&hm=${encodeURIComponent(birthInfo.hebrewMonth)}&hy=${mitzvahYear}&strict=1`;
    
      const response = await fetch(url);
      const data = await response.json();
    
      return {
        birthHebrewDate: birthInfo.hebrewDate,
        mitzvahHebrewDate: data.hebrew,
        mitzvahGregorianDate: data.gy + "-" + String(data.gm).padStart(2,"0") + "-" + String(data.gd).padStart(2,"0")
      };
    }

    async function getParashaInfo(dateValue){
      const url = `https://www.hebcal.com/shabbat?cfg=json&geonameid=293397&M=on&gy=${dateValue.slice(0,4)}&gm=${Number(dateValue.slice(5,7))}&gd=${Number(dateValue.slice(8,10))}`;
    
      const response = await fetch(url);
      const data = await response.json();
    
      const parashaItem = data.items.find(item => item.category === "parashat");
    
      return {
        parasha: parashaItem ? parashaItem.hebrew : "לא זוהתה פרשה",
        parashaEnglish: parashaItem ? parashaItem.title : ""
      };

    function getAliyahByHebrewDay(hebrewDay){
      const aliyot = [

        "שלישית",
        "רביעית",
        "חמישית",
        "שישית",
        "שביעית"
      ];
    
      const dayNumber = Number(hebrewDay);
    
      if(!dayNumber){
        return "לא זוהתה";
      }
    
      const index = (dayNumber - 1) % 7;
    
      return aliyot[index];
    }

    function getGematriaValue(text){
      const values = {

        ו:6, ז:7, ח:8, ט:9,
        י:10, כ:20, ך:20,

      }

    function hebrewLettersToNumber(text){
      const values = {
        א:1, ב:2, ג:3, ד:4, ה:5,
        ו:6, ז:7, ח:8, ט:9,
        י:10, כ:20, ך:20,

        פ:80, ף:80,
        צ:90, ץ:90,
        ק:100,
        ר:200,
        ש:300,
        ת:400
      };
    
      let cleanText = String(text)
        .replace(/[״׳"']/g, "")
        .replace(/\s/g, "")
        .trim();
    
      let total = 0;
    
      for(const char of cleanText){
        total += values[char] || 0;
      }
    
      return total;
    }
    
    function normalizeHebrewYear(hebrewYearText){
      let cleanYear = String(hebrewYearText)
        .replace(/[״׳"']/g, "")
        .replace(/\s/g, "")
        .trim();
    
      if(/^\d+$/.test(cleanYear)){
        return Number(cleanYear);
      }
    
      if(cleanYear.startsWith("ה")){
        cleanYear = cleanYear.slice(1);
      }
    
      const yearValue = hebrewLettersToNumber(cleanYear);
    
      if(!yearValue){
        throw new Error("Invalid Hebrew year");
      }
    
      return 5000 + yearValue;
    }    
    
    async function getGregorianFromHebrewDate(hebrewDay, hebrewMonth, hebrewYear){
      const url = `https://www.hebcal.com/converter?cfg=json&h2g=1&hd=${hebrewDay}&hm=${encodeURIComponent(hebrewMonth)}&hy=${hebrewYear}&strict=1`;
    
      const response = await fetch(url);
      const data = await response.json();
    
      if(!data.gy || !data.gm || !data.gd){
        throw new Error("Invalid Hebrew date");
      }
    
      return data.gy + "-" + String(data.gm).padStart(2,"0") + "-" + String(data.gd).padStart(2,"0");
    }
    
    generateBtn.addEventListener("click", async ()=>{

      const data = {
        firstName: document.getElementById("firstName").value.trim(),
        relationType: document.getElementById("relationType").value,
        gender: document.getElementById("gender").value,
        fatherName: document.getElementById("fatherName").value.trim(),
        motherName: document.getElementById("motherName").value.trim(),
        parentDisplay: document.getElementById("parentDisplay").value,
        birthType: document.querySelector('input[name="birthType"]:checked').value,
        birthDate: document.getElementById("birthDate").value.trim(),
        hebrewDay: document.getElementById("hebrewDay").value,
        hebrewMonth: document.getElementById("hebrewMonth").value,
        hebrewYear: document.getElementById("hebrewYear").value.trim(),
        birthTime: document.getElementById("birthTime").value,
        createdAt: serverTimestamp()
      };

      if(!data.firstName || !data.relationType || !data.gender || !data.fatherName || !data.motherName){
        alert("יש למלא שם פרטי, בן/בת, מין בלידה, שם אב ושם אם.");
        return;
      }
      
      if(data.birthType === "gregorian" && !data.birthDate){
        alert("יש למלא תאריך לידה לועזי.");
        return;
      }
      
      if(data.birthType === "hebrew" && (!data.hebrewDay || !data.hebrewMonth || !data.hebrewYear)){
        alert("יש למלא יום, חודש ושנה עברית.");
        return;
      }

      formBox.classList.add("hidden");
      resultBox.style.display = "block";
      resultBox.innerHTML = `
        <div class="result-loading">
          🤿 צוללים לעומק הנתונים שלך...
        </div>
      `;
      if(data.birthType === "hebrew"){
        try{
          data.birthDate = await getGregorianFromHebrewDate(
            data.hebrewDay,
            data.hebrewMonth,
            data.hebrewYear
          );
        }catch(err){
          console.error("Hebrew to Gregorian error:", err);
          alert("לא הצלחנו להמיר את התאריך העברי. נא לבדוק שהיום, החודש והשנה תקינים.");
          return;
        }
      }
      
      try{
        await addDoc(collection(db, "personalMessages"), data);
      }catch(err){
        console.error(err);
      }
      
      let hebcalInfo = null;
      
      try{
        hebcalInfo = await getHebcalDateInfo(data.birthDate);
      }catch(err){
        console.error("Hebcal error:", err);
      }
      
      data.hebcalInfo = hebcalInfo;

       let mitzvahInfo = null;
      
      try{
        mitzvahInfo = await getBarBatMitzvahInfo(data.birthDate, data.gender);
      }catch(err){
        console.error("Mitzvah error:", err);
      }
      
      data.mitzvahInfo = mitzvahInfo; 

      let parashaInfo = null;
      
      try{
        if(data.mitzvahInfo?.mitzvahGregorianDate){
          parashaInfo = await getParashaInfo(data.mitzvahInfo.mitzvahGregorianDate);
        }
      }catch(err){
        console.error("Parasha error:", err);
      }
      
      data.parashaInfo = parashaInfo;            
      
      try{
        const html = buildLocalMessageHtml(data);
        resultBox.innerHTML = html;
      
        const aiLoadingBox = document.createElement("div");
        aiLoadingBox.className = "ai-section";
        aiLoadingBox.innerHTML = `
          <div class="ai-section-title">העמקה אישית</div>
          <div class="ai-section-content">✨ מכינים עבורך העמקה אישית עדינה...</div>
        `;
      
        resultBox.appendChild(aiLoadingBox);
      
        try{
          const aiMessage = await getAiPersonalMessage(data);
      
          aiLoadingBox.innerHTML = `
            <div class="ai-section-title">העמקה אישית</div>
            <div class="ai-section-content">${escapeHtml(aiMessage).replace(/\n/g, "<br>")}</div>
          `;
        }catch(aiErr){
          console.warn("AI message error:", aiErr);
      
          aiLoadingBox.innerHTML = `
            <div class="ai-section-title">העמקה אישית</div>
            <div class="ai-section-content">
              כרגע ההעמקה האישית אינה זמינה. הנתונים הבסיסיים למעלה חושבו בהצלחה.
            </div>
          `;
        }
      
        resultActions.classList.remove("hidden");
      
      }catch(err){
        console.error("Render error:", err);
        resultBox.textContent = "אירעה תקלה ביצירת ההודעה האישית. אפשר לנסות שוב בעוד רגע.";
      }
    });

    document.getElementById("printBtn").addEventListener("click", ()=>{
      window.print();
    });

    document.getElementById("shareBtn").addEventListener("click", async ()=>{
      const text = resultBox.textContent;

      if(navigator.share){
        await navigator.share({
          title: "האור שבי",
          text
        });
      }else{
        await navigator.clipboard.writeText(text);
        alert("הסיכום הועתק ללוח. אפשר להדביק ולשתף.");
      }
    });
  </script>
