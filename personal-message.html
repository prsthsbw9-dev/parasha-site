<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>האור שבי</title>

  <style>
    *{ box-sizing:border-box; }

    html,body{
      min-height:100%;
      margin:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:#071014;
      color:#fff;
      overflow-x:hidden;
    }

    .sea-bg-video{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:0;
      background:#071014;
      transform:scale(1.04);
      pointer-events:none;
    }

    .sea-bg-overlay{
      position:fixed;
      inset:0;
      z-index:1;
      background:rgba(0,0,0,.18);
      pointer-events:none;
    }

    .page{
      position:relative;
      z-index:2;
      min-height:100vh;
      width:min(100%,560px);
      margin:0 auto;
      padding:20px 10px 34px;
      text-align:center;
    }

    .hero-logo{
      width:clamp(150px,42vw,225px);
      height:clamp(150px,42vw,225px);
      object-fit:cover;
      border-radius:50%;
      display:block;
      margin:0 auto 10px;
      border:2px solid rgba(255,255,255,.76);
      box-shadow:
        0 0 0 4px rgba(80,80,255,.32),
        0 0 34px rgba(255,255,255,.28),
        0 12px 32px rgba(0,0,0,.45);
    }

    h1{
      margin:0 0 8px;
      font-size:clamp(34px,8vw,54px);
      font-weight:900;
      text-shadow:0 4px 18px rgba(0,0,0,.75);
    }

    .subtitle{
      margin:0 auto 18px;
      max-width:430px;
      font-size:clamp(16px,4vw,22px);
      line-height:1.55;
      font-weight:700;
      color:rgba(255,255,255,.94);
      text-shadow:0 3px 14px rgba(0,0,0,.72);
    }

    .glass-box{
      width:100%;
      background:transparent;
      border:1px solid rgba(255,255,255,.28);
      border-radius:24px;
      padding:16px 12px;
      box-shadow:none;
    }

    .field{
      text-align:right;
      margin-bottom:14px;
    }

    label{
      display:block;
      margin-bottom:7px;
      font-weight:800;
      color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.55);
    }

    input,select{
      width:100%;
      border:1px solid rgba(255,255,255,.34);
      border-radius:16px;
      padding:13px 12px;
      background:transparent;
      color:#fff;
      font-size:15px;
      outline:none;
      text-shadow:0 2px 8px rgba(0,0,0,.35);
    }

    input::placeholder{
      color:rgba(255,255,255,.62);
    }

    select option{
      background:#0d2630;
      color:#fff;
    }

    .date-choice-box{
      display:flex;
      gap:10px;
      margin-bottom:10px;
    }

    .radio-option{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border:1px solid rgba(255,255,255,.34);
      border-radius:16px;
      padding:12px;
      cursor:pointer;
      background:rgba(0,0,0,.08);
    }

    .radio-option input{
      width:auto;
      accent-color:#7eefff;
    }

    .radio-option span{
      font-weight:900;
    }

    .date-input-box{
      margin-top:8px;
    }

    .desktop-date-box{
      display:block;
    }

    .mobile-date-box{
      display:none;
    }

    #birthDateDesktop{
      text-align:center;
      direction:ltr;
      font-size:17px;
      font-weight:900;
      letter-spacing:.5px;
      background:rgba(60,170,200,.12);
      border:1px solid rgba(120,220,255,.48);
      color:#fff;

    #birthDateDesktop::placeholder{

    }

    .desktop-date-helper{

      min-height:auto;
      padding:7px 10px;
      font-size:13px;
      border:none;
      background:transparent;
      color:rgba(255,255,255,.78);

      .desktop-date-box{

      }

    .date-picker-wrap{

    }

    .date-helper{

      border-radius:16px;

      background:rgba(60,170,200,.12);

      text-align:center;

    .tribe-note{

      font-size:12px;

    .hidden{
      display:none !important;

  </style>
</head>

<body>

  <div class="sea-bg-overlay"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDtrEyAnVMhCZWnSaUYut9LxNC17C3So1Y",
      authDomain: "parasha-site-links.firebaseapp.com",
      projectId: "parasha-site-links",
      storageBucket: "parasha-site-links.firebasestorage.app",
      messagingSenderId: "799400165769",
      appId: "1:799400165769:web:1b5cf70eee80e772df6158"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const generateBtn = document.getElementById("generateBtn");
    const formBox = document.getElementById("formBox");
    const resultBox = document.getElementById("resultBox");
    const resultActions = document.getElementById("resultActions");

    function escapeHtml(text){
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatGregorianDate(dateValue){
      const date = new Date(dateValue + "T12:00:00");

      return date.toLocaleDateString("he-IL", {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      });
    }

    function hebrewNumber(num){
      const ones = ["","א","ב","ג","ד","ה","ו","ז","ח","ט"];
      const tens = ["","י","כ","ל","מ","נ","ס","ע","פ","צ"];
      const hundreds = ["","ק","ר","ש","ת"];

      let n = Number(num);

      if(!Number.isFinite(n)){
        return "";
      }

      if(n >= 5000){
        n = n % 1000;
      }

      let result = "";

      while(n >= 400){
        result += "ת";
        n -= 400;
      }

      if(n >= 100){
        result += hundreds[Math.floor(n / 100)];
        n = n % 100;
      }

      if(n === 15){
        result += "טו";
      }else if(n === 16){
        result += "טז";
      }else{
        result += tens[Math.floor(n / 10)];
        result += ones[n % 10];
      }

      if(result.length === 1){
        return result + "׳";
      }

      return result.slice(0,-1) + "״" + result.slice(-1);
    }

    function formatHebrewYearLabel(year){
      return "ה" + hebrewNumber(year);
    }

    function populateHebrewYearSelect(){
      const hebrewYearSelect = document.getElementById("hebrewYear");

      if(!hebrewYearSelect){
        return;
      }

      const startYear = 5795;
      const endYear = 5600;

      for(let year = startYear; year >= endYear; year--){
        const option = document.createElement("option");

        option.value = String(year);
        option.textContent = `${formatHebrewYearLabel(year)} (${year})`;

        hebrewYearSelect.appendChild(option);
      }
    }

    populateHebrewYearSelect();

    function formatHebrewDate(dateValue){
      const date = new Date(dateValue + "T12:00:00");

      const parts = new Intl.DateTimeFormat("he-u-ca-hebrew", {
        day:"numeric",
        month:"long",
        year:"numeric"
      }).formatToParts(date);

      const day = parts.find(part => part.type === "day")?.value || "";
      const month = parts.find(part => part.type === "month")?.value || "";
      const year = parts.find(part => part.type === "year" || part.type === "relatedYear")?.value || "";

      return `${hebrewNumber(day)} ב${month} ${hebrewNumber(year)}`;
    }

    function getHebrewMonthName(dateValue){
      const date = new Date(dateValue + "T12:00:00");

      const parts = new Intl.DateTimeFormat("he-u-ca-hebrew", {
        month:"long"
      }).formatToParts(date);

      const monthPart = parts.find(part => part.type === "month");

      return monthPart ? monthPart.value : "";
    }

    function normalizeHebrewMonthName(monthName){
      if(!monthName){
        return "";
      }

      if(String(monthName).includes("אדר")){
        return "אדר";
      }

      return monthName;
    }

    function formatHebrewDateWithYearNumber(data){
      const hebrewDay = data.hebcalInfo?.hebrewDay;
      const hebrewYear = data.hebcalInfo?.hebrewYear;
      const hebrewMonth = getHebrewMonthName(data.birthDate);

      if(!hebrewDay || !hebrewYear || !hebrewMonth){
        return formatHebrewDate(data.birthDate);
      }

      return `${hebrewNumber(hebrewDay)} ב${hebrewMonth} ה${hebrewNumber(hebrewYear)}   |   ${hebrewYear}`;
    }

    function getWeekdayHebrew(dateValue){
      const date = new Date(dateValue + "T12:00:00");

      return date.toLocaleDateString("he-IL", {
        weekday:"long"
      });
    }

    function parseLocalDate(dateValue){
      const parts = String(dateValue).split("-");
      const year = Number(parts[0]);
      const month = Number(parts[1]) - 1;
      const day = Number(parts[2]);

      return new Date(year, month, day, 12, 0, 0, 0);
    }

    function getTodayLocalNoon(){
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0, 0);
    }

    function daysInMonth(year, monthIndex){
      return new Date(year, monthIndex + 1, 0).getDate();
    }

    function addYearsLocal(date, years){
      const targetYear = date.getFullYear() + years;
      const targetMonth = date.getMonth();
      const targetDay = Math.min(date.getDate(), daysInMonth(targetYear, targetMonth));

      return new Date(targetYear, targetMonth, targetDay, 12, 0, 0, 0);
    }

    function addMonthsLocal(date, months){
      const target = new Date(date.getFullYear(), date.getMonth() + months, 1, 12, 0, 0, 0);
      const targetDay = Math.min(date.getDate(), daysInMonth(target.getFullYear(), target.getMonth()));
      target.setDate(targetDay);

      return target;
    }

    function formatAgeText(ageDetails){
      const parts = [];

      if(ageDetails.years === 1){
        parts.push("שנה אחת");
      }else{
        parts.push(`${ageDetails.years} שנים`);
      }

      if(ageDetails.months === 1){
        parts.push("חודש אחד");
      }else if(ageDetails.months > 1){
        parts.push(`${ageDetails.months} חודשים`);
      }

      if(ageDetails.days === 1){
        parts.push("יום אחד");
      }else if(ageDetails.days > 1){
        parts.push(`${ageDetails.days} ימים`);
      }

      return parts.join(", ");
    }

    function calculateAgeDetails(dateValue){
      const birthDate = parseLocalDate(dateValue);
      const today = getTodayLocalNoon();

      let years = today.getFullYear() - birthDate.getFullYear();
      let lastBirthday = addYearsLocal(birthDate, years);

      if(lastBirthday > today){
        years--;
        lastBirthday = addYearsLocal(birthDate, years);
      }

      let months = (today.getFullYear() - lastBirthday.getFullYear()) * 12 + (today.getMonth() - lastBirthday.getMonth());
      let monthAnchor = addMonthsLocal(lastBirthday, months);

      if(monthAnchor > today){
        months--;
        monthAnchor = addMonthsLocal(lastBirthday, months);
      }

      const oneDay = 1000 * 60 * 60 * 24;
      const days = Math.max(0, Math.floor((today - monthAnchor) / oneDay));
      const nextBirthday = addYearsLocal(birthDate, years + 1);
      const daysToNextBirthday = Math.max(0, Math.ceil((nextBirthday - today) / oneDay));

      return {
        years,
        months,
        days,
        isMinor: years < 18,
        currentLifeYear: years + 1,
        nextBirthdayDate: nextBirthday,
        daysToNextBirthday,
        ageText: "",
        lifeYearText: `שנת החיים ה־${years + 1}`
      };
    }

    function sumDigitsString(text){
      return String(text)
        .replace(/\D/g, "")
        .split("")
        .filter(Boolean)
        .map(Number);
    }

    function reduceNumberWithSteps(number){
      const steps = [];
      let current = Number(number);

      while(current > 9){
        const digits = String(current).split("").map(Number);
        const next = digits.reduce((sum, digit)=> sum + digit, 0);
        steps.push({
          from: current,
          expression: digits.join("+"),
          to: next
        });
        current = next;
      }

      return {
        coreNumber: current,
        steps
      };
    }

    function calculateHebrewDateReduction(data, isMinor){
      const hebrewDay = Number(data.hebcalInfo?.hebrewDay || 0);
      const rawHebrewMonth = getHebrewMonthName(data.birthDate);
      const hebrewMonthLetters = cleanHebrewLettersOnly(rawHebrewMonth);
      const hebrewMonthValue = getGematriaValue(hebrewMonthLetters);
      const hebrewYearFull = Number(data.hebcalInfo?.hebrewYear || 0);
      const hebrewYearShort = hebrewYearFull ? hebrewYearFull % 1000 : 0;

      if(!hebrewDay || !hebrewMonthValue || !hebrewYearShort){
        return {
          dayValue: hebrewDay || "",
          monthValue: hebrewMonthValue || "",
          yearValue: hebrewYearShort || "",
          fullSum: "",
          coreNumber: "לא זוהה",
          calculationText: "לא הצלחנו לחשב את הרמז המספרי לפי התאריך העברי.",
          profile: getHebrewDateReductionProfile(9, isMinor)
        };
      }

      const fullSum = hebrewDay + hebrewMonthValue + hebrewYearShort;
      const reduction = reduceNumberWithSteps(fullSum);
      const profile = getHebrewDateReductionProfile(reduction.coreNumber, isMinor);

      const dayLabel = hebrewNumber(hebrewDay);
      const yearLabel = hebrewNumber(hebrewYearShort);
      const stepTexts = [`${dayLabel}=${hebrewDay} + ${rawHebrewMonth}=${hebrewMonthValue} + ${yearLabel}=${hebrewYearShort} → ${fullSum}`];

      reduction.steps.forEach(step=>{
        stepTexts.push(`${step.expression}=${step.to}`);
      });

      return {
        dayLabel,
        dayValue: hebrewDay,
        monthLabel: rawHebrewMonth,
        monthValue: hebrewMonthValue,
        yearLabel,
        yearValue: hebrewYearShort,
        fullSum,
        coreNumber: reduction.coreNumber,
        calculationText: stepTexts.join(" → "),
        profile,
        note: "החישוב נעשה לפי היום, החודש ושנת הלידה העברית ללא האלפים, כדי לשמור על חיבור ללוח היהודי. זהו רמז להתבוננות ולא קביעה מוחלטת."
      };
    }

    async function getHebcalDateInfo(dateValue){
      const url = `https://www.hebcal.com/converter?cfg=json&date=${dateValue}&g2h=1&strict=1`;

      const response = await fetch(url);
      const data = await response.json();

      return {
        hebrewDate: data.hebrew,
        hebrewDay: data.hd,
        hebrewMonth: data.hm,
        hebrewYear: data.hy
      };
    }

    async function getBarBatMitzvahInfo(dateValue, gender){
      const birthInfo = await getHebcalDateInfo(dateValue);

      const mitzvahYear =
        gender === "female"
          ? birthInfo.hebrewYear + 12
          : birthInfo.hebrewYear + 13;

      const url = `https://www.hebcal.com/converter?cfg=json&h2g=1&hd=${birthInfo.hebrewDay}&hm=${encodeURIComponent(birthInfo.hebrewMonth)}&hy=${mitzvahYear}&strict=1`;

      const response = await fetch(url);
      const data = await response.json();

      return {
        birthHebrewDate: birthInfo.hebrewDate,
        mitzvahHebrewDate: data.hebrew,
        mitzvahGregorianDate: data.gy + "-" + String(data.gm).padStart(2,"0") + "-" + String(data.gd).padStart(2,"0")
      };
    }

    function addDaysToDateValue(dateValue, days){
      const date = new Date(dateValue + "T12:00:00");
      date.setDate(date.getDate() + days);

      return date.toISOString().slice(0,10);
    }

    function getNextShabbatDate(dateValue){
      const date = new Date(dateValue + "T12:00:00");
      const day = date.getDay();
      const daysUntilShabbat = (6 - day + 7) % 7;

      return addDaysToDateValue(dateValue, daysUntilShabbat);
    }

    function getNextWeekdayTorahReadingDate(dateValue){
      for(let i = 0; i <= 7; i++){
        const checkDateValue = addDaysToDateValue(dateValue, i);
        const checkDate = new Date(checkDateValue + "T12:00:00");
        const day = checkDate.getDay();

        if(day === 1 || day === 4 || day === 6){
          return checkDateValue;
        }
      }

      return getNextShabbatDate(dateValue);
    }

    function getHebcalDisplayTitle(item){
      if(!item){
        return "";
      }

      return item.hebrew || item.title || "";
    }

    function isUsefulSpecialReadingItem(item){
      if(!item){
        return false;
      }

      const category = item.category || "";
      const title = item.title || "";

      if(["candles", "havdalah", "omer", "zmanim"].includes(category)){
        return false;
      }

      if(title.toLowerCase().includes("candle")){
        return false;
      }

      return ["holiday", "roshchodesh", "molad", "mevarchim", "special", "haftara", "omer"].includes(category);
    }

      const items = Array.isArray(data.items) ? data.items : [];
      const parashaItem = items.find(item => item.category === "parashat");

    function getGematriaValue(text){
      const values = {
        א:1, ב:2, ג:3, ד:4, ה:5,
        ו:6, ז:7, ח:8, ט:9,
        י:10, כ:20, ך:20,

        פ:80, ף:80,
        צ:90, ץ:90,

      for(const char of text){

    function typeText(element, text, speed = 18){
      element.textContent = "";
      let i = 0;

      const timer = setInterval(()=>{
        element.textContent += text.charAt(i);
        i++;

        if(i >= text.length){
          clearInterval(timer);
          resultActions.classList.remove("hidden");
        }
      }, speed);

    function hebrewLettersToNumber(text){
      const values = {
        א:1, ב:2, ג:3, ד:4, ה:5,
        ו:6, ז:7, ח:8, ט:9,
        י:10, כ:20, ך:20,
        ל:30,
        מ:40, ם:40,
        נ:50, ן:50,
        ס:60,
        ע:70,
        פ:80, ף:80,
        צ:90, ץ:90,
        ק:100,
        ר:200,
        ש:300,
        ת:400
      };

      let cleanText = String(text)
        .replace(/[״׳"']/g, "")
        .replace(/\s/g, "")
        .trim();

      let total = 0;

      for(const char of cleanText){
        total += values[char] || 0;
      }

      return total;
    }

    function normalizeHebrewYear(hebrewYearText){
      let cleanYear = String(hebrewYearText)
        .replace(/[״׳"']/g, "")
        .replace(/\s/g, "")
        .trim();

      if(/^\d+$/.test(cleanYear)){
        return Number(cleanYear);
      }

      if(cleanYear.startsWith("ה")){
        cleanYear = cleanYear.slice(1);
      }

      const yearValue = hebrewLettersToNumber(cleanYear);

      if(!yearValue){
        throw new Error("Invalid Hebrew year");
      }

      return 5000 + yearValue;
    }

    async function getGregorianFromHebrewDate(hebrewDay, hebrewMonth, hebrewYear){
      const normalizedYear = normalizeHebrewYear(hebrewYear);
      const url = `https://www.hebcal.com/converter?cfg=json&h2g=1&hd=${hebrewDay}&hm=${encodeURIComponent(hebrewMonth)}&hy=${normalizedYear}&strict=1`;

      const response = await fetch(url);
      const data = await response.json();

      if(!data.gy || !data.gm || !data.gd){
        throw new Error("Invalid Hebrew date");
      }

      return data.gy + "-" + String(data.gm).padStart(2,"0") + "-" + String(data.gd).padStart(2,"0");
    }

    function getRelationTypeFromGender(gender){
      if(gender === "male"){

    function normalizeGregorianDateInput(value){
      const raw = String(value || "").trim();

      // מאפשר כתיבה במחשב: 14/05/1980 או 14-05-1980 או 14.05.1980
      const match = raw.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})$/);

      if(!match){
        return "";
      }

      const day = Number(match[1]);
      const month = Number(match[2]);
      const year = Number(match[3]);

      if(
        !Number.isFinite(day) ||
        !Number.isFinite(month) ||
        !Number.isFinite(year) ||
        day < 1 ||
        day > 31 ||
        month < 1 ||
        month > 12 ||
        year < 1900 ||
        year > 2100
      ){
        return "";
      }

      const testDate = new Date(year, month - 1, day, 12, 0, 0, 0);

      if(
        testDate.getFullYear() !== year ||
        testDate.getMonth() !== month - 1 ||
        testDate.getDate() !== day
      ){
        return "";
      }

      return `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    }
