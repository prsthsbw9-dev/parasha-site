<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <title>הוספת שמות | עץ הפרד״ס החי</title>

  <style>
    *{
      box-sizing:border-box;
    }

    html,
    body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:#071018;
      color:#fff;
      font-family:Arial,sans-serif;
    }

    body{
      min-height:100vh;
      min-height:100dvh;
      display:grid;
      place-items:center;
    }

    .intro-stage{
      position:relative;
      width:min(100vw, calc(100dvh * 9 / 16));
      height:min(100dvh, calc(100vw * 16 / 9));
      max-width:100vw;
      max-height:100dvh;
      overflow:hidden;
      background:#071018;
      isolation:isolate;
    }

    .intro-video{
      position:absolute;
      inset:0;
      z-index:1;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      background:#071018;
    }

    .intro-poster{
      position:absolute;
      inset:0;
      z-index:2;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      background:#071018;
      opacity:1;
      visibility:visible;
      pointer-events:none;
      transition:opacity .22s ease, visibility .22s ease;
    }

    .intro-poster.is-hidden{
      opacity:0;
      visibility:hidden;
    }

    .intro-stage::after{
      content:"";
      position:absolute;
      inset:auto 0 0;
      z-index:3;
      height:48%;
      pointer-events:none;
      opacity:0;
      background:linear-gradient(
        to top,
        rgba(4,9,13,.44) 0%,
        rgba(4,9,13,.15) 45%,
        rgba(4,9,13,0) 100%
      );
      transition:opacity .65s ease;
    }

    .intro-stage.is-finished::after{
      opacity:1;
    }

    .names-cta-wrap{
      position:absolute;
      top:56.5%;
      left:50%;
      z-index:4;
      width:min(82%, 390px);
      transform:translate(-50%, 24px);
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      text-align:center;
      transition:
        opacity .7s ease,
        transform .7s ease,
        visibility .7s ease;
    }

    .intro-stage.is-finished .names-cta-wrap{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
      transform:translate(-50%, 0);
    }

    .names-cta{
      width:100%;
      min-height:58px;
      padding:13px 24px;
      border:1.5px solid rgba(255,255,255,.88);
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      background:linear-gradient(135deg,#8d5d12 0%,#d79a2b 48%,#8b590f 100%);
      box-shadow:
        0 0 0 3px rgba(255,210,116,.18),
        0 0 28px rgba(255,199,87,.52),
        0 10px 28px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.42);
      text-decoration:none;
      font-size:clamp(21px,5.6vw,29px);
      font-weight:900;
      line-height:1.15;
      text-shadow:0 2px 7px rgba(0,0,0,.55);
      -webkit-tap-highlight-color:transparent;
      transition:transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .names-cta:hover,
    .names-cta:focus-visible{
      transform:translateY(-2px);
      filter:brightness(1.08);
      box-shadow:
        0 0 0 4px rgba(255,220,142,.23),
        0 0 35px rgba(255,199,87,.66),
        0 12px 30px rgba(0,0,0,.46),
        inset 0 1px 0 rgba(255,255,255,.48);
      outline:none;
    }

    .names-cta:active{
      transform:scale(.985);
    }

    @media (max-width:700px){
      .names-cta-wrap{
        top:var(--mobile-names-button-top, 73%);
      }
    }
    
    @media (max-width:700px) and (max-height:680px){
      .names-cta-wrap{
        width:min(78%, 350px);
      }
    
      .names-cta{
        min-height:52px;
        padding:11px 20px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      .intro-stage::after,
      .intro-poster,
      .names-cta-wrap,
      .names-cta{
        transition:none;
      }
    }
  </style>
</head>

<body>
  <main
    id="introStage"
    class="intro-stage"
    aria-label="סרטון פתיחה להוספת שמות"
  >
    <video
      id="namesIntroVideo"
      class="intro-video"
      autoplay
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      poster="names-intro-mobile-poster.jpg"
      aria-hidden="true"
    >
      <source src="names-intro-mobile.mp4" type="video/mp4">
    </video>

    <img
      id="namesIntroPoster"
      class="intro-poster"
      src="names-intro-mobile-poster.jpg"
      alt=""
      aria-hidden="true"
    >

    <div id="namesCtaWrap" class="names-cta-wrap">
      <a
        id="namesCta"
        class="names-cta"
        href="names.html"
        aria-label="להוספת שמות"
      >
        להוספת שמות
      </a>
    </div>
  </main>

  <script>
    (function(){
      "use strict";

      const INTRO_SEEN_KEY = "pardesNamesIntroSeenV1";
      const NAMES_PAGE = "names.html";
      const replayRequested =
        new URLSearchParams(window.location.search).get("replay") === "1";

      try{
        if(!replayRequested && sessionStorage.getItem(INTRO_SEEN_KEY) === "1"){
          window.location.replace(NAMES_PAGE);
          return;
        }
      }catch(error){}

      const stage = document.getElementById("introStage");
      const video = document.getElementById("namesIntroVideo");
      const poster = document.getElementById("namesIntroPoster");
      const cta = document.getElementById("namesCta");

      function updateNamesButtonPosition(){
        const viewport = window.visualViewport;
      
        const screenHeight = viewport
          ? viewport.height
          : window.innerHeight;
      
        const screenWidth = viewport
          ? viewport.width
          : window.innerWidth;
      
        if(screenWidth > 700){
          stage.style.removeProperty(
            "--mobile-names-button-top"
          );
          return;
        }
      
        let buttonTop = 73;
      
        /*
          במסכים נמוכים או בדפדפנים פנימיים שמשאירים
          פחות מקום פנוי — מורידים את הלחצן יותר.
        */
        if(screenHeight <= 620){
          buttonTop = 76;
        }else if(screenHeight <= 720){
          buttonTop = 75;
        }else if(screenHeight <= 820){
          buttonTop = 74;
        }else if(screenHeight >= 950){
          buttonTop = 72;
        }
      
        stage.style.setProperty(
          "--mobile-names-button-top",
          `${buttonTop}%`
        );
      }
      
      updateNamesButtonPosition();
      
      window.addEventListener(
        "resize",
        updateNamesButtonPosition
      );
      
      window.addEventListener(
        "orientationchange",
        updateNamesButtonPosition
      );
      
      if(window.visualViewport){
        window.visualViewport.addEventListener(
          "resize",
          updateNamesButtonPosition
        );
      }      

      
      let finished = false;
      let safetyTimer = null;
      let posterHidden = false;

      function hidePoster(){
        if(posterHidden) return;
        posterHidden = true;
        poster.classList.add("is-hidden");
      }

      function hidePosterAfterRealFrame(){
        if(
          typeof video.requestVideoFrameCallback === "function"
        ){
          video.requestVideoFrameCallback(hidePoster);
          return;
        }

        window.requestAnimationFrame(function(){
          window.requestAnimationFrame(hidePoster);
        });
      }

      function rememberIntro(){
        try{
          sessionStorage.setItem(INTRO_SEEN_KEY,"1");
        }catch(error){}
      }

      function showNamesButton(){
        if(finished) return;
        finished = true;
        clearTimeout(safetyTimer);

        if(video){
          video.pause();

          if(Number.isFinite(video.duration) && video.duration > .12){
            try{
              video.currentTime = Math.max(0,video.duration - .08);
            }catch(error){}
          }
        }

        rememberIntro();
        stage.classList.add("is-finished");

        window.setTimeout(function(){
          cta.focus({ preventScroll:true });
        },750);
      }

      cta.addEventListener("click",rememberIntro);

      video.addEventListener("ended",showNamesButton);
      video.addEventListener("error",showNamesButton);
      video.addEventListener(
        "playing",
        hidePosterAfterRealFrame,
        { once:true }
      );

      video.muted = true;
      video.volume = 0;

      const playPromise = video.play();

      if(playPromise && typeof playPromise.catch === "function"){
        playPromise.catch(function(){
          window.setTimeout(showNamesButton,900);
        });
      }

      safetyTimer = window.setTimeout(showNamesButton,18000);
    })();
  </script>
</body>
</html>
