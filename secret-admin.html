<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>ניהול קישורי עליה</title>

  <style>

    body{
      margin:0;
      min-height:100vh;
      background:#05070b;
      font-family:Arial,sans-serif;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px;
    }

    .box{
      width:min(100%,430px);
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:24px;
      padding:28px;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:0 14px 40px rgba(0,0,0,.45);
    }

    h1{
      margin-top:0;
      margin-bottom:24px;
      text-align:center;
      font-size:30px;
    }

    .field{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:700;
    }

    input{
      width:100%;
      box-sizing:border-box;
      padding:14px;
      border-radius:14px;
      border:none;
      outline:none;
      background:rgba(255,255,255,.1);
      color:#fff;
      font-size:15px;
    }

    button{
      width:100%;
      border:none;
      border-radius:16px;
      padding:16px;
      background:#1f8bff;
      color:#fff;
      font-size:17px;
      font-weight:700;
      cursor:pointer;
      transition:.2s ease;
    }

    button:hover{
      transform:translateY(-2px);
      background:#3b9cff;
    }

    .success{
      margin-top:18px;
      text-align:center;
      color:#63ffae;
      font-weight:700;
      display:none;
    }

  </style>
</head>

<body>

  <div class="box">

    <h1>ניהול קישורי עליה</h1>

    <div class="field">
      <label>אימייל</label>
      <input id="email" type="email">
    </div>

    <div class="field">
      <label>סיסמה</label>
      <input id="password" type="password">
    </div>

    <button id="loginBtn">
      התחברות
    </button>

    <div id="adminPanel" style="display:none; margin-top:28px;">

      <div class="field">
        <label>קישור YouTube - פשט</label>
        <input id="youtube">
      </div>

      <div class="field">
        <label>קישור Facebook - רמז</label>
        <input id="facebook">
      </div>

      <div class="field">
        <label>קישור Instagram - דרש</label>
        <input id="instagram">
      </div>

      <div class="field">
        <label>קישור TikTok - ראשי</label>
        <input id="tiktok">
      </div>

      <div class="field">
        <label>קישור WhatsApp - סוד</label>
        <input id="whatsapp">
      </div>

      <button id="saveBtn">
        שמור קישורים
      </button>

      <div class="success" id="successMsg">
        הקישורים נשמרו בהצלחה
      </div>

    </div>

  </div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDtrEyAnVMhCZWnSaUYut9LxNC17C3So1Y",
  authDomain: "parasha-site-links.firebaseapp.com",
  projectId: "parasha-site-links",
  storageBucket: "parasha-site-links.firebasestorage.app",
  messagingSenderId: "799400165769",
  appId: "1:799400165769:web:1b5cf70eee80e772df6158"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

const loginBtn = document.getElementById("loginBtn");

const saveBtn = document.getElementById("saveBtn");

loginBtn.addEventListener("click", async ()=>{

  const email = document.getElementById("email").value;

  const password = document.getElementById("password").value;

  try{

    await signInWithEmailAndPassword(auth,email,password);

    document.getElementById("adminPanel").style.display = "block";

    loadCurrentLinks();

  }catch(err){

    alert("התחברות נכשלה");

  }

});

async function loadCurrentLinks(){

  const docRef = doc(db,"links","current");

  const docSnap = await getDoc(docRef);

  if(docSnap.exists()){

    const data = docSnap.data();

    document.getElementById("youtube").value = data.youtube || "";
    document.getElementById("facebook").value = data.facebook || "";
    document.getElementById("instagram").value = data.instagram || "";
    document.getElementById("tiktok").value = data.tiktok || "";
    document.getElementById("whatsapp").value = data.whatsapp || "";

  }

}

saveBtn.addEventListener("click", async ()=>{

  await setDoc(doc(db,"links","current"),{

    youtube:document.getElementById("youtube").value,
    facebook:document.getElementById("facebook").value,
    instagram:document.getElementById("instagram").value,
    tiktok:document.getElementById("tiktok").value,
    whatsapp:document.getElementById("whatsapp").value

  });

  document.getElementById("successMsg").style.display = "block";

});

</script>

</body>
</html>
