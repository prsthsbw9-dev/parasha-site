<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>פרד״ס העליה</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *{ box-sizing:border-box; }

    html,body{
      min-height:100%;
      margin:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:#071014;
      color:#fff;
      overflow-x:hidden;
    }

    .sea-bg-video{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:0;
      background:#071014;
      transform:scale(1.04);
      pointer-events:none;
    }

    .sea-bg-overlay{
      position:fixed;
      inset:0;
      z-index:1;
      background:rgba(0,0,0,.16);
      pointer-events:none;
    }

    .page{
      position:relative;
      z-index:2;
      min-height:100vh;
      width:min(100%,560px);
      margin:0 auto;
      padding:20px 10px 34px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .gate-card{
      width:100%;
      position:relative;
    }

    .hero-logo{
      width:clamp(150px, 42vw, 225px);
      height:clamp(150px, 42vw, 225px);
      object-fit:cover;
      border-radius:50%;
      display:block;
      margin:0 auto 10px;
      border:2px solid rgba(255,255,255,.76);
      box-shadow:
        0 0 0 4px rgba(80,80,255,.32),
        0 0 34px rgba(255,255,255,.28),
        0 12px 32px rgba(0,0,0,.45);
    }

    .gate-title{
      margin:0 0 6px;
      font-size:clamp(36px, 9vw, 58px);
      font-weight:900;
      color:#fff;
      text-shadow:0 4px 18px rgba(0,0,0,.75);
      line-height:1.05;
    }

    .gate-subtitle{
      margin:0 auto 4px;
      font-size:clamp(17px, 4.5vw, 24px);
      line-height:1.55;
      font-weight:700;
      color:rgba(255,255,255,.96);
      text-shadow:0 3px 14px rgba(0,0,0,.72);
      max-width:430px;
    }

    .gate-note{
      font-size:clamp(14px, 3.6vw, 18px);
      color:rgba(255,255,255,.86);
    }

    .pardes-tree-wrap{
      position:relative;
      width:min(100%, 430px);
      height:390px;
      margin:8px auto 14px;
      direction:ltr;
      isolation:isolate;
    }

    .pardes-tree-svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      overflow:visible;
      pointer-events:none;
      filter:drop-shadow(0 10px 18px rgba(0,0,0,.25));
    }

    .pardes-tree-svg .tree-trunk{
      fill:none;
      stroke:rgba(210,175,130,.78);
      stroke-width:16;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .pardes-tree-svg .tree-trunk-light{
      fill:none;
      stroke:rgba(255,255,255,.30);
      stroke-width:4;
      stroke-linecap:round;
    }

    .pardes-tree-svg .tree-branch{
      fill:none;
      stroke:rgba(220,188,145,.68);
      stroke-width:7;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .pardes-tree-svg .tree-branch.thin{
      stroke:rgba(235,215,185,.42);
      stroke-width:3;
    }

    .pardes-tree-svg .tree-leaf{
      fill:rgba(86,185,138,.22);
      stroke:rgba(255,255,255,.26);
      stroke-width:1.3;
    }

    .pardes-tree-svg .tree-leaf-light{
      fill:rgba(255,255,255,.08);
      stroke:rgba(255,255,255,.20);
      stroke-width:1;
    }

    .fruit-link{
      position:absolute;
      z-index:3;
      width:68px;
      height:68px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-decoration:none;
      background:radial-gradient(circle at 35% 25%, rgba(255,255,255,.34), rgba(255,255,255,.08) 42%, rgba(255,255,255,.02) 70%);
      border:1px solid rgba(255,255,255,.48);
      box-shadow:
        0 0 0 6px rgba(255,255,255,.06),
        0 10px 24px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.30);
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
      transition:transform .22s ease, box-shadow .22s ease, background .22s ease;
    }

    .fruit-link:hover{
      transform:translateY(-4px) scale(1.06);
      background:radial-gradient(circle at 35% 25%, rgba(255,255,255,.46), rgba(255,255,255,.12) 42%, rgba(255,255,255,.04) 72%);
      box-shadow:
        0 0 0 8px rgba(255,255,255,.08),
        0 14px 30px rgba(0,0,0,.38),
        0 0 18px rgba(255,255,255,.34),
        inset 0 1px 0 rgba(255,255,255,.38);
    }

    .fruit-link i{
      font-size:34px;
      line-height:1;
      text-shadow:0 4px 12px rgba(0,0,0,.45);
    }

    .fruit-instagram{ left:18px; top:132px; }
    .fruit-facebook{ left:118px; top:62px; }
    .fruit-youtube{ right:118px; top:62px; }
    .fruit-tiktok{ right:18px; top:132px; }

    .fruit-whatsapp{ left:34px; bottom:82px; }
    .fruit-tikun{ right:34px; bottom:82px; }

    .fruit-email{ left:125px; top:180px; }
    .fruit-names{ right:125px; top:180px; }

    .fruit-instagram i{ color:#E4405F !important; }
    .fruit-facebook i{ color:#1877F2 !important; }
    .fruit-youtube i{ color:#FF0000 !important; }

    .fruit-tiktok i{
      color:#FFFFFF !important;
      filter:drop-shadow(-2px 0 0 #25F4EE) drop-shadow(2px 0 0 #FE2C55);
    }

    .fruit-whatsapp i{ color:#25D366 !important; }

    .fruit-email i{
      color:#FFFFFF !important;
    }

    .fruit-names i{
      color:#FFFFFF !important;
      opacity:.92;
      filter:
        drop-shadow(0 0 5px rgba(255,255,255,.35))
        drop-shadow(0 0 10px rgba(120,220,255,.16));
    }

    .fruit-logo-icon{
      width:38px;
      height:38px;
      object-fit:cover;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.55);
      box-shadow:
        0 0 12px rgba(255,255,255,.18);
    }

    .fruit-letter{
      position:absolute;
      top:72px;
      left:50%;
      transform:translateX(-50%);
      color:#fff;
      font-size:18px;
      font-weight:900;
      line-height:1;
      text-shadow:0 3px 10px rgba(0,0,0,.85);
      pointer-events:none;
      white-space:nowrap;
    }

    .fruit-word{
      font-size:13px;
      min-width:80px;
      text-align:center;
    }

    .secret-admin-hit{
      position:absolute;
      left:8px;
      bottom:8px;
      width:34px;
      height:34px;
      opacity:0;
      z-index:20;
    }

    @media (max-width:420px){

      .page{
        padding:14px 8px 24px;
      }

      .pardes-tree-wrap{
        height:370px;
        width:min(100%, 390px);
        margin-top:4px;
        margin-bottom:12px;
      }

      .fruit-link{
        width:60px;
        height:60px;
      }

      .fruit-link i{
        font-size:30px;
      }

      .fruit-logo-icon{
        width:34px;
        height:34px;
      }

      .fruit-instagram{ left:10px; top:126px; }
      .fruit-facebook{ left:95px; top:58px; }
      .fruit-youtube{ right:95px; top:58px; }
      .fruit-tiktok{ right:10px; top:126px; }

      .fruit-whatsapp{ left:28px; bottom:82px; }
      .fruit-tikun{ right:28px; bottom:82px; }

      .fruit-email{ left:80px; top:205px; }
      .fruit-names{ right:80px; top:205px; }

      .fruit-link:hover{
        transform:translateY(-4px) scale(1.06);
      }

      .fruit-letter{
        top:64px;
        font-size:16px;
      }

      .fruit-word{
        font-size:12px;
        min-width:78px;
      }
    }
  </style>
</head>

<body>

  <video class="sea-bg-video" autoplay muted loop playsinline poster="ocean-poster.jpg">
    <source src="ocean.mp4" type="video/mp4">
  </video>

  <div class="sea-bg-overlay"></div>

  <div class="page">
    <div class="gate-card">

      <img class="hero-logo" src="logo.png" alt="פרשת השבוע" />

      <h1 class="gate-title">הפרדס</h1>

      <div class="gate-subtitle">
        בחרו ענף אחד כדי להעמיק בעלייה זו

        <br>

        <span class="gate-note">
          כל ענף כאן קשור לחיים שלך
        </span>
      </div>

      <div class="pardes-tree-wrap" aria-label="קישורי פרדס העלייה">

        <svg class="pardes-tree-svg" viewBox="0 0 430 390" aria-hidden="true" focusable="false">
          <defs>
            <radialGradient id="treeGlow" cx="50%" cy="45%" r="62%">
              <stop offset="0%" stop-color="rgba(255,255,255,.18)" />
              <stop offset="65%" stop-color="rgba(255,255,255,.04)" />
              <stop offset="100%" stop-color="rgba(255,255,255,0)" />
            </radialGradient>
          </defs>

          <ellipse cx="215" cy="185" rx="198" ry="148" fill="url(#treeGlow)" />

          <g opacity=".95">
            <ellipse class="tree-leaf" cx="82" cy="132" rx="34" ry="20" transform="rotate(-28 82 132)" />
            <ellipse class="tree-leaf" cx="126" cy="82" rx="34" ry="20" transform="rotate(22 126 82)" />
            <ellipse class="tree-leaf" cx="178" cy="60" rx="32" ry="19" transform="rotate(-18 178 60)" />
            <ellipse class="tree-leaf" cx="256" cy="60" rx="32" ry="19" transform="rotate(18 256 60)" />
            <ellipse class="tree-leaf" cx="304" cy="82" rx="34" ry="20" transform="rotate(-22 304 82)" />
            <ellipse class="tree-leaf" cx="362" cy="132" rx="34" ry="20" transform="rotate(28 362 132)" />
            <ellipse class="tree-leaf" cx="96" cy="236" rx="34" ry="20" transform="rotate(24 96 236)" />
            <ellipse class="tree-leaf" cx="336" cy="236" rx="34" ry="20" transform="rotate(-24 336 236)" />
            <ellipse class="tree-leaf-light" cx="215" cy="110" rx="48" ry="26" />
            <ellipse class="tree-leaf-light" cx="215" cy="215" rx="60" ry="32" />
          </g>

          <path class="tree-branch" d="M215 346 C210 280 211 205 214 126" />
          <path class="tree-trunk" d="M215 374 C212 315 213 250 216 182 C218 138 216 100 213 66" />
          <path class="tree-trunk-light" d="M221 364 C220 308 220 250 222 186 C224 140 222 104 220 76" />

          <path class="tree-branch" d="M215 186 C174 161 132 136 78 131" />
          <path class="tree-branch" d="M214 164 C185 130 158 98 137 70" />
          <path class="tree-branch" d="M216 168 C244 130 271 96 296 70" />
          <path class="tree-branch" d="M218 188 C260 161 315 138 372 134" />
          <path class="tree-branch" d="M214 240 C164 222 110 228 72 266" />
          <path class="tree-branch" d="M220 240 C270 222 324 228 360 266" />

          <path class="tree-branch thin" d="M120 122 C102 96 94 76 88 52" />
          <path class="tree-branch thin" d="M151 92 C143 64 148 42 164 22" />
          <path class="tree-branch thin" d="M276 92 C285 64 280 42 263 22" />
          <path class="tree-branch thin" d="M335 124 C352 96 360 76 366 52" />
          <path class="tree-branch thin" d="M112 232 C82 216 58 216 30 226" />
          <path class="tree-branch thin" d="M320 232 C350 216 374 216 402 226" />

          <path class="tree-branch thin" d="M202 186 C182 192 164 200 146 218" />
          <path class="tree-branch thin" d="M228 186 C248 192 266 200 284 218" />
        </svg>

        <a id="instagramLink" class="fruit-link fruit-instagram" href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram - דרש">
          <i class="fa-brands fa-instagram"></i>
          <span class="fruit-letter">ד</span>
        </a>

        <a id="facebookLink" class="fruit-link fruit-facebook" href="#" target="_blank" rel="noopener noreferrer" aria-label="Facebook - רמז">
          <i class="fa-brands fa-facebook-f"></i>
          <span class="fruit-letter">ר</span>
        </a>

        <a id="youtubeLink" class="fruit-link fruit-youtube" href="#" target="_blank" rel="noopener noreferrer" aria-label="YouTube - פשט">
          <i class="fa-brands fa-youtube"></i>
          <span class="fruit-letter">פ</span>
        </a>

        <a id="tiktokLink" class="fruit-link fruit-tiktok" href="#" target="_blank" rel="noopener noreferrer" aria-label="TikTok - ראשי">
          <i class="fa-brands fa-tiktok"></i>
          <span class="fruit-letter">ה</span>
        </a>

        <a id="whatsappLink" class="fruit-link fruit-whatsapp" href="#" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp - סוד">
          <i class="fa-brands fa-whatsapp"></i>
          <span class="fruit-letter">ס</span>
        </a>

        <a id="tikunLink" class="fruit-link fruit-tikun" href="personal-message.html" aria-label="האור שבי">
          <img class="fruit-logo-icon" src="logo.png" alt="האור שבי">
          <span class="fruit-letter fruit-word">האור שבי</span>
        </a>

        <a id="emailLink" class="fruit-link fruit-email" href="mailto:prsthsbw9@gmail.com" aria-label="שליחת מייל">
          <i class="fa-regular fa-envelope"></i>
          <span class="fruit-letter fruit-word">מייל</span>
        </a>

        <a id="namesLink" class="fruit-link fruit-names" href="names.html" aria-label="הוספת שמות">
          <i class="fa-solid fa-user-group"></i>
          <span class="fruit-letter fruit-word">שמות</span>
        </a>

        <a href="secret-admin.html" class="secret-admin-hit" aria-label="כניסה נסתרת לניהול"></a>

      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDtrEyAnVMhCZWnSaUYut9LxNC17C3So1Y",
      authDomain: "parasha-site-links.firebaseapp.com",
      projectId: "parasha-site-links",
      storageBucket: "parasha-site-links.firebasestorage.app",
      messagingSenderId: "799400165769",
      appId: "1:799400165769:web:1b5cf70eee80e772df6158"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadLinks(){
      const docRef = doc(db, "links", "current");
      const docSnap = await getDoc(docRef);

      if(docSnap.exists()){
        const data = docSnap.data();

        document.getElementById("youtubeLink").href = data.youtube || "#";
        document.getElementById("facebookLink").href = data.facebook || "#";
        document.getElementById("instagramLink").href = data.instagram || "#";
        document.getElementById("tiktokLink").href = data.tiktok || "#";
        document.getElementById("whatsappLink").href = data.whatsapp || "#";
      }
    }

    loadLinks();
  </script>

</body>
</html>
