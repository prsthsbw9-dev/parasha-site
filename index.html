<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>פרד״ס העליה</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *{ box-sizing:border-box; }

    html,body{
      min-height:100%;
      margin:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:#071014;
      color:#fff;
      overflow-x:hidden;
    }

    .sea-bg-video{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:0;
      background:#071014;
      transform:scale(1.04);
      pointer-events:none;
    }

    .sea-bg-overlay{
      position:fixed;
      inset:0;
      z-index:1;
      background:rgba(0,0,0,.16);
      pointer-events:none;
    }

    .page{
      position:relative;
      z-index:2;
      min-height:100vh;
      width:min(100%,560px);
      margin:0 auto;
      padding:20px 10px 34px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .gate-card{
      width:100%;
      position:relative;
    }

    .hero-logo{
      width:clamp(150px, 42vw, 225px);
      height:clamp(150px, 42vw, 225px);
      object-fit:cover;
      border-radius:50%;
      display:block;
      margin:0 auto 10px;
      border:2px solid rgba(255,255,255,.76);
      box-shadow:
        0 0 0 4px rgba(80,80,255,.32),
        0 0 34px rgba(255,255,255,.28),
        0 12px 32px rgba(0,0,0,.45);
    }

    .gate-title{
      margin:0 0 6px;
      font-size:clamp(36px, 9vw, 58px);
      font-weight:900;
      color:#fff;
      text-shadow:0 4px 18px rgba(0,0,0,.75);
      line-height:1.05;
    }

    .gate-subtitle{
      margin:0 auto 4px;
      font-size:clamp(17px, 4.5vw, 24px);
      line-height:1.55;
      font-weight:700;
      color:rgba(255,255,255,.96);
      text-shadow:0 3px 14px rgba(0,0,0,.72);
      max-width:430px;
    }

    .gate-note{
      font-size:clamp(14px, 3.6vw, 18px);
      color:rgba(255,255,255,.86);
    }

    .pardes-tree-wrap{
      position:relative;
      width:min(100%, 430px);
      height:390px;
      margin:8px auto 14px;
      direction:ltr;
      isolation:isolate;
    }

    .pardes-tree-svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      overflow:visible;
      pointer-events:none;
      filter:drop-shadow(0 10px 18px rgba(0,0,0,.25));
    }

    .pardes-tree-svg .tree-trunk{
      fill:none;
      stroke:rgba(210,175,130,.78);
      stroke-width:16;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .pardes-tree-svg .tree-trunk-light{
      fill:none;
      stroke:rgba(255,255,255,.30);
      stroke-width:4;
      stroke-linecap:round;
    }

    .pardes-tree-svg .tree-branch{
      fill:none;
      stroke:rgba(220,188,145,.68);
      stroke-width:7;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .pardes-tree-svg .tree-branch.thin{
      stroke:rgba(235,215,185,.42);
      stroke-width:3;
    }

    .pardes-tree-svg .tree-leaf{
      fill:rgba(86,185,138,.22);
      stroke:rgba(255,255,255,.26);
      stroke-width:1.3;
    }

    .pardes-tree-svg .tree-leaf-light{
      fill:rgba(255,255,255,.08);
      stroke:rgba(255,255,255,.20);
      stroke-width:1;
    }

    .fruit-link{
      position:absolute;
      z-index:3;
      width:72px;
      height:72px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-decoration:none;
      overflow:visible;
      background:
        radial-gradient(circle at 32% 22%, rgba(255,255,255,.92), rgba(255,255,255,.34) 18%, rgba(255,255,255,.07) 46%),
        radial-gradient(circle at 50% 72%, rgba(0,0,0,.18), rgba(0,0,0,.02) 62%);
      border:1px solid rgba(255,255,255,.72);
      box-shadow:
        0 0 0 6px rgba(255,255,255,.07),
        0 10px 25px rgba(0,0,0,.36),
        0 0 22px var(--fruit-glow, rgba(255,255,255,.28)),
        inset 0 2px 0 rgba(255,255,255,.55),
        inset 0 -10px 20px rgba(0,0,0,.14);
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
      transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
    }

    .fruit-link::before{
      content:"";
      position:absolute;
      top:-8px;
      right:17px;
      width:18px;
      height:11px;
      border-radius:100% 0 100% 0;
      background:linear-gradient(135deg, rgba(160,255,170,.95), rgba(38,150,72,.88));
      transform:rotate(-22deg);
      box-shadow:0 0 10px rgba(95,255,140,.32);
    }

    .fruit-link::after{
      content:"";
      position:absolute;
      inset:7px 10px auto auto;
      width:18px;
      height:18px;
      border-radius:50%;
      background:rgba(255,255,255,.35);
      filter:blur(1px);
      pointer-events:none;
    }

    .fruit-link:hover{
      transform:translateY(-5px) scale(1.08);
      filter:saturate(1.15) brightness(1.08);
      box-shadow:
        0 0 0 9px rgba(255,255,255,.09),
        0 15px 32px rgba(0,0,0,.42),
        0 0 30px var(--fruit-glow, rgba(255,255,255,.42)),
        0 0 56px var(--fruit-glow-soft, rgba(255,255,255,.20)),
        inset 0 2px 0 rgba(255,255,255,.70),
        inset 0 -12px 22px rgba(0,0,0,.16);
    }

    .pardes-fruit-icon{
      position:relative;
      z-index:2;
      font-size:36px;
      line-height:1;
      transform:translateY(-1px);
      text-shadow:
        0 3px 8px rgba(0,0,0,.38),
        0 0 14px rgba(255,255,255,.24);
    }

    .fruit-pshat{
      right:118px;
      top:62px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.95), rgba(255,185,170,.34) 18%, rgba(255,72,78,.88) 56%, rgba(145,12,24,.94) 100%);
      --fruit-glow:rgba(255,72,78,.62);
      --fruit-glow-soft:rgba(255,72,78,.26);
    }

    .fruit-remez{
      left:118px;
      top:62px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.95), rgba(220,190,255,.34) 18%, rgba(126,72,255,.90) 56%, rgba(52,22,132,.96) 100%);
      --fruit-glow:rgba(152,98,255,.68);
      --fruit-glow-soft:rgba(152,98,255,.28);
    }

    .fruit-drash{
      left:18px;
      top:132px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.95), rgba(255,226,158,.38) 18%, rgba(255,145,38,.92) 56%, rgba(145,67,4,.96) 100%);
      --fruit-glow:rgba(255,160,48,.70);
      --fruit-glow-soft:rgba(255,160,48,.30);
    }

    .fruit-sod{
      right:18px;
      top:132px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.98), rgba(255,250,180,.40) 18%, rgba(255,219,65,.94) 56%, rgba(155,110,0,.96) 100%);
      --fruit-glow:rgba(255,225,75,.72);
      --fruit-glow-soft:rgba(255,225,75,.32);
    }

    .fruit-whatsapp{
      left:34px;
      bottom:82px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.94), rgba(180,255,210,.34) 18%, rgba(37,211,102,.90) 56%, rgba(15,105,54,.96) 100%);
      --fruit-glow:rgba(37,211,102,.64);
      --fruit-glow-soft:rgba(37,211,102,.26);
    }

    .fruit-tikun{
      right:34px;
      bottom:82px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.96), rgba(190,235,255,.34) 18%, rgba(92,180,255,.84) 56%, rgba(23,82,145,.96) 100%);
      --fruit-glow:rgba(100,210,255,.62);
      --fruit-glow-soft:rgba(100,210,255,.26);
    }

    .fruit-email{
      left:125px;
      top:180px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.96), rgba(235,245,255,.36) 18%, rgba(110,165,245,.84) 56%, rgba(24,61,130,.96) 100%);
      --fruit-glow:rgba(120,190,255,.58);
      --fruit-glow-soft:rgba(120,190,255,.24);
    }

    .fruit-names{
      right:125px;
      top:180px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.96), rgba(255,210,235,.36) 18%, rgba(230,88,160,.86) 56%, rgba(122,22,82,.96) 100%);
      --fruit-glow:rgba(255,110,185,.60);
      --fruit-glow-soft:rgba(255,110,185,.25);
    }

    .fruit-link i{
      position:relative;
      z-index:2;
      font-size:31px;
      line-height:1;
      color:#fff !important;
      text-shadow:
        0 3px 9px rgba(0,0,0,.42),
        0 0 13px rgba(255,255,255,.26);
    }



    .fig-icon{
      position:relative;
      z-index:2;
      width:38px;
      height:38px;
      display:inline-block;
      transform:translateY(-1px);
      filter:
        drop-shadow(0 3px 8px rgba(0,0,0,.38))
        drop-shadow(0 0 12px rgba(255,255,255,.18));
    }

    .fig-icon .fig-stem{
      position:absolute;
      top:2px;
      left:6px;
      width:12px;
      height:4px;
      background:linear-gradient(180deg,#8e6a44 0%,#6b4a26 100%);
      border-radius:4px;
      transform:rotate(-24deg);
      z-index:4;
      box-shadow:0 0 2px rgba(255,255,255,.12);
    }

    .fig-icon .fig-leaf{
      position:absolute;
      background:linear-gradient(180deg,#8ee96c 0%, #57bf3c 48%, #2f8730 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.34),
        0 0 7px rgba(125,255,120,.18);
      z-index:1;
    }

    .fig-icon .fig-leaf-left{
      top:1px;
      left:7px;
      width:24px;
      height:18px;
      border-radius:55% 45% 58% 42% / 62% 58% 42% 38%;
      transform:rotate(-8deg);
      clip-path:polygon(0% 56%, 10% 34%, 26% 22%, 42% 16%, 56% 6%, 72% 10%, 100% 24%, 84% 42%, 74% 56%, 92% 76%, 74% 76%, 60% 100%, 48% 82%, 34% 96%, 28% 76%, 8% 74%, 18% 58%);
    }

    .fig-icon .fig-leaf-right{
      top:8px;
      left:18px;
      width:20px;
      height:15px;
      border-radius:48% 52% 46% 54% / 54% 46% 54% 46%;
      transform:rotate(26deg);
      clip-path:polygon(0% 54%, 10% 32%, 28% 18%, 48% 8%, 68% 14%, 100% 30%, 82% 48%, 72% 58%, 88% 82%, 66% 76%, 54% 100%, 40% 80%, 24% 92%, 18% 74%, 0% 70%, 14% 56%);
    }

    .fig-icon .fig-fruit{
      position:absolute;
      left:9px;
      top:11px;
      width:21px;
      height:25px;
      background:
        radial-gradient(circle at 34% 24%, rgba(255,255,255,.78) 0%, rgba(255,255,255,.20) 10%, rgba(255,255,255,0) 18%),
        linear-gradient(180deg,#ba8aa6 0%, #986b8e 16%, #90658b 26%, #815276 46%, #7a466e 66%, #67325b 100%);
      border-radius:48% 48% 52% 52% / 34% 34% 66% 66%;
      z-index:3;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.35),
        inset 0 -3px 6px rgba(0,0,0,.16),
        0 0 9px rgba(202,140,190,.18);
      overflow:hidden;
    }

    .fig-icon .fig-fruit::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg, transparent 0%, rgba(240,215,182,.26) 22%, transparent 38%, rgba(240,215,182,.22) 52%, transparent 66%, rgba(240,215,182,.16) 80%, transparent 100%);
      opacity:.95;
    }

    .fig-icon .fig-fruit::after{
      content:"";
      position:absolute;
      bottom:2px;
      left:8px;
      width:5px;
      height:5px;
      border-radius:50%;
      background:rgba(240,220,180,.55);
      box-shadow:0 0 3px rgba(255,255,255,.18);
    }

    .fruit-logo-icon{
      position:relative;
      z-index:2;
      width:36px;
      height:36px;
      object-fit:cover;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.70);
      box-shadow:
        0 0 12px rgba(255,255,255,.28);
    }

    .fruit-letter{
      position:absolute;
      top:72px;
      left:50%;
      transform:translateX(-50%);
      color:#fff;
      font-size:18px;
      font-weight:900;
      line-height:1;
      text-shadow:0 3px 10px rgba(0,0,0,.85);
      pointer-events:none;
      white-space:nowrap;
    }

    .fruit-word{
      font-size:13px;
      min-width:80px;
      text-align:center;
    }



    .pardes-video-panel{
      position:fixed;
      inset:0;
      z-index:50;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(0,0,0,.62);
      backdrop-filter:blur(9px);
      -webkit-backdrop-filter:blur(9px);
    }

    .pardes-video-panel.is-open{
      display:flex;
    }

    .pardes-video-card{
      width:min(100%, 560px);
      border-radius:26px;
      border:1px solid rgba(255,255,255,.30);
      background:linear-gradient(180deg, rgba(7,16,20,.94), rgba(5,9,14,.90));
      box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 34px rgba(255,255,255,.10);
      overflow:hidden;
      text-align:right;
    }

    .pardes-video-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:14px 16px 10px;
    }

    .pardes-video-title{
      margin:0;
      font-size:19px;
      font-weight:900;
      line-height:1.35;
      color:#fff;
      text-shadow:0 3px 12px rgba(0,0,0,.65);
    }

    .pardes-video-close{
      width:38px;
      height:38px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.34);
      background:rgba(255,255,255,.10);
      color:#fff;
      font-size:26px;
      line-height:1;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(0,0,0,.25);
    }

    .pardes-video-body{
      padding:0 14px 16px;
    }

    .pardes-video-player{
      width:100%;
      max-height:72vh;
      border-radius:20px;
      background:#000;
      display:block;
      outline:none;
    }

    .pardes-video-empty{
      display:none;
      padding:26px 18px;
      border-radius:20px;
      border:1px dashed rgba(255,255,255,.30);
      background:rgba(255,255,255,.08);
      color:rgba(255,255,255,.92);
      font-size:16px;
      line-height:1.65;
      text-align:center;
    }

    .pardes-current-label{
      margin:8px auto 0;
      width:min(100%, 430px);
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.24);
      background:rgba(0,0,0,.18);
      color:rgba(255,255,255,.92);
      font-size:14px;
      font-weight:800;
      text-shadow:0 2px 10px rgba(0,0,0,.7);
    }

    .secret-admin-hit{
      position:absolute;
      left:8px;
      bottom:8px;
      width:34px;
      height:34px;
      opacity:0;
      z-index:20;
    }

    @media (max-width:420px){

      .page{
        padding:14px 8px 24px;
      }

      .pardes-tree-wrap{
        height:370px;
        width:min(100%, 390px);
        margin-top:4px;
        margin-bottom:12px;
      }

      .fruit-link{
        width:62px;
        height:62px;
      }

      .pardes-fruit-icon{
        font-size:31px;
      }

      .fruit-link i{
        font-size:27px;
      }

      .fruit-logo-icon{
        width:32px;
        height:32px;
      }

      .fruit-pshat{ right:95px; top:58px; }
      .fruit-remez{ left:95px; top:58px; }
      .fruit-drash{ left:10px; top:126px; }
      .fruit-sod{ right:10px; top:126px; }

      .fruit-whatsapp{ left:28px; bottom:82px; }
      .fruit-tikun{ right:28px; bottom:82px; }

      .fruit-email{ left:105px; top:185px; }
      .fruit-names{ right:105px; top:185px; }

      .fruit-link:hover{
        transform:translateY(-4px) scale(1.06);
      }

      .fruit-letter{
        top:64px;
        font-size:16px;
      }

      .fruit-word{
        font-size:12px;
        min-width:78px;
      }
    }
  </style>
</head>

<body>

  <video class="sea-bg-video" autoplay muted loop playsinline poster="ocean-poster.jpg">
    <source src="ocean.mp4" type="video/mp4">
  </video>

  <div class="sea-bg-overlay"></div>

  <div class="page">
    <div class="gate-card">

      <img class="hero-logo" src="logo.png" alt="פרשת השבוע" />

      <h1 class="gate-title">הפרדס</h1>

      <div class="gate-subtitle">
        בכל ענף יש פרי לנשמה שלך

        <br>

        <span class="gate-note">
          ובכל פרי — עומק שעוד לא הכרת
        </span>
      </div>

      <div class="pardes-tree-wrap" aria-label="קישורי פרדס העלייה">

        <svg class="pardes-tree-svg" viewBox="0 0 430 390" aria-hidden="true" focusable="false">
          <defs>
            <radialGradient id="treeGlow" cx="50%" cy="45%" r="62%">
              <stop offset="0%" stop-color="rgba(255,255,255,.18)" />
              <stop offset="65%" stop-color="rgba(255,255,255,.04)" />
              <stop offset="100%" stop-color="rgba(255,255,255,0)" />
            </radialGradient>
          </defs>

          <ellipse cx="215" cy="185" rx="198" ry="148" fill="url(#treeGlow)" />

          <g opacity=".95">
            <ellipse class="tree-leaf" cx="82" cy="132" rx="34" ry="20" transform="rotate(-28 82 132)" />
            <ellipse class="tree-leaf" cx="126" cy="82" rx="34" ry="20" transform="rotate(22 126 82)" />
            <ellipse class="tree-leaf" cx="178" cy="60" rx="32" ry="19" transform="rotate(-18 178 60)" />
            <ellipse class="tree-leaf" cx="256" cy="60" rx="32" ry="19" transform="rotate(18 256 60)" />
            <ellipse class="tree-leaf" cx="304" cy="82" rx="34" ry="20" transform="rotate(-22 304 82)" />
            <ellipse class="tree-leaf" cx="362" cy="132" rx="34" ry="20" transform="rotate(28 362 132)" />
            <ellipse class="tree-leaf" cx="96" cy="236" rx="34" ry="20" transform="rotate(24 96 236)" />
            <ellipse class="tree-leaf" cx="336" cy="236" rx="34" ry="20" transform="rotate(-24 336 236)" />
            <ellipse class="tree-leaf-light" cx="215" cy="110" rx="48" ry="26" />
            <ellipse class="tree-leaf-light" cx="215" cy="215" rx="60" ry="32" />
          </g>

          <path class="tree-branch" d="M215 346 C210 280 211 205 214 126" />
          <path class="tree-trunk" d="M215 374 C212 315 213 250 216 182 C218 138 216 100 213 66" />
          <path class="tree-trunk-light" d="M221 364 C220 308 220 250 222 186 C224 140 222 104 220 76" />

          <path class="tree-branch" d="M215 186 C174 161 132 136 78 131" />
          <path class="tree-branch" d="M214 164 C185 130 158 98 137 70" />
          <path class="tree-branch" d="M216 168 C244 130 271 96 296 70" />
          <path class="tree-branch" d="M218 188 C260 161 315 138 372 134" />
          <path class="tree-branch" d="M214 240 C164 222 110 228 72 266" />
          <path class="tree-branch" d="M220 240 C270 222 324 228 360 266" />

          <path class="tree-branch thin" d="M120 122 C102 96 94 76 88 52" />
          <path class="tree-branch thin" d="M151 92 C143 64 148 42 164 22" />
          <path class="tree-branch thin" d="M276 92 C285 64 280 42 263 22" />
          <path class="tree-branch thin" d="M335 124 C352 96 360 76 366 52" />
          <path class="tree-branch thin" d="M112 232 C82 216 58 216 30 226" />
          <path class="tree-branch thin" d="M320 232 C350 216 374 216 402 226" />

          <path class="tree-branch thin" d="M202 186 C182 192 164 200 146 218" />
          <path class="tree-branch thin" d="M228 186 C248 192 266 200 284 218" />
        </svg>

        <a id="sodLink" class="fruit-link fruit-drash" href="#" aria-label="סוד העלייה">
          <span class="pardes-fruit-icon" aria-hidden="true">🍇</span>
          <span class="fruit-letter fruit-word">סוד</span>
        </a>

        <a id="drashLink" class="fruit-link fruit-remez" href="#" aria-label="דרש העלייה">
          <span class="fig-icon" aria-hidden="true">
            <span class="fig-stem"></span>
            <span class="fig-leaf fig-leaf-left"></span>
            <span class="fig-leaf fig-leaf-right"></span>
            <span class="fig-fruit"></span>
          </span>
          <span class="fruit-letter fruit-word">דרש</span>
        </a>

        <a id="remezLink" class="fruit-link fruit-pshat" href="#" aria-label="רמז העלייה">
          <span class="pardes-fruit-icon" aria-hidden="true">🍋</span>
          <span class="fruit-letter fruit-word">רמז</span>
        </a>

        <a id="pshatLink" class="fruit-link fruit-sod" href="#" aria-label="פשט העלייה">
          <span class="pardes-fruit-icon" aria-hidden="true">🌾</span>
          <span class="fruit-letter fruit-word">פשט</span>
        </a>

        <a id="whatsappLink" class="fruit-link fruit-whatsapp" href="#" target="_blank" rel="noopener noreferrer" aria-label="ערוץ וואטסאפ">

          <span class="fruit-letter fruit-word">וואטסאפ</span>

          <img class="fruit-logo-icon" src="logo.png" alt="האור שבי">
          <span class="fruit-letter fruit-word">האור שבי</span>
        </a>

          <i class="fa-regular fa-envelope"></i>
          <span class="fruit-letter fruit-word">מייל</span>

        <a id="namesLink" class="fruit-link fruit-names" href="names.html" aria-label="הוספת שמות">

    </div>
  </div>

  <div id="pardesVideoPanel" class="pardes-video-panel" aria-hidden="true">
    <div class="pardes-video-card" role="dialog" aria-modal="true" aria-labelledby="pardesVideoTitle">
      <div class="pardes-video-head">
        <h2 id="pardesVideoTitle" class="pardes-video-title">עומק העלייה</h2>
        <button id="pardesVideoClose" class="pardes-video-close" type="button" aria-label="סגירה">×</button>
      </div>
      <div class="pardes-video-body">
        <video id="pardesVideoPlayer" class="pardes-video-player" controls playsinline preload="metadata"></video>
        <div id="pardesVideoEmpty" class="pardes-video-empty"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDtrEyAnVMhCZWnSaUYut9LxNC17C3So1Y",
      authDomain: "parasha-site-links.firebaseapp.com",
      projectId: "parasha-site-links",
      storageBucket: "parasha-site-links.firebasestorage.app",
      messagingSenderId: "799400165769",
      appId: "1:799400165769:web:1b5cf70eee80e772df6158"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const layerNames = {
      pshat: "פשט",
      remez: "רמז",
      drash: "דרש",
      sod: "סוד"
    };

    let currentParasha = "";
    let currentAliyah = "";
    let currentParashaKey = "";
    let currentAliyahKey = "";
    let activeVideos = {};

    function makeSafeKey(value){
      return String(value || "")
        .trim()
        .replace(/[\\/#?%&.\[\]*]/g, "-")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function videoDocId(parashaKey, aliyahKey){
      return `${parashaKey}_${aliyahKey}`;
    }

    function setCurrentLabel(text){
      const label = document.getElementById("currentAliyahLabel");
      if(label){ label.textContent = text; }
    }

    async function loadActiveAliyah(){
      try{
        const currentRef = doc(db, "links", "current");
        const currentSnap = await getDoc(currentRef);

        if(!currentSnap.exists()){
          setCurrentLabel("עדיין לא הוגדרה עלייה פעילה");
          return;
        }

        const current = currentSnap.data();

        currentParasha = current.currentParasha || current.parasha || "";
        currentAliyah = current.currentAliyah || current.aliyah || "";
        currentParashaKey = current.currentParashaKey || makeSafeKey(currentParasha);
        currentAliyahKey = current.currentAliyahKey || makeSafeKey(currentAliyah);

        const whatsappLink = document.getElementById("whatsappLink");
        if(whatsappLink){ whatsappLink.href = current.whatsapp || "#"; }

        if(!currentParasha || !currentAliyah){
          setCurrentLabel("עדיין לא נבחרו פרשה ועלייה פעילות");
          return;
        }

        setCurrentLabel(`העלייה הפעילה: פרשת ${currentParasha} — ${currentAliyah}`);

        const videosRef = doc(db, "aliyahVideos", videoDocId(currentParashaKey, currentAliyahKey));
        const videosSnap = await getDoc(videosRef);

        activeVideos = videosSnap.exists() ? videosSnap.data() : {};
      }catch(error){
        console.error("שגיאה בטעינת העלייה הפעילה:", error);
        setCurrentLabel("לא ניתן היה לטעון את העלייה הפעילה כרגע");
      }
    }

    function openLayer(layer){
      const panel = document.getElementById("pardesVideoPanel");
      const title = document.getElementById("pardesVideoTitle");
      const player = document.getElementById("pardesVideoPlayer");
      const empty = document.getElementById("pardesVideoEmpty");

      const item = activeVideos?.[layer];
      const layerName = layerNames[layer] || "פרד״ס";

      if(title){
        title.textContent = `${layerName} — פרשת ${currentParasha || ""} ${currentAliyah || ""}`.trim();
      }

      if(item?.url){
        empty.style.display = "none";
        player.style.display = "block";
        player.src = item.url;
        player.load();
      }else{
        player.pause();
        player.removeAttribute("src");
        player.load();
        player.style.display = "none";
        empty.style.display = "block";
        empty.innerHTML = `עדיין לא הועלה סרטון <b>${layerName}</b> עבור העלייה הפעילה.<br>אפשר להעלות אותו דרך דף הניהול הסודי.`;
      }

      panel.classList.add("is-open");
      panel.setAttribute("aria-hidden", "false");
    }

    function closePanel(){
      const panel = document.getElementById("pardesVideoPanel");
      const player = document.getElementById("pardesVideoPlayer");
      if(player){
        player.pause();
        player.removeAttribute("src");
        player.load();
      }
      panel.classList.remove("is-open");
      panel.setAttribute("aria-hidden", "true");
    }

    document.getElementById("pshatLink")?.addEventListener("click", (event) => {
      event.preventDefault();
      openLayer("pshat");
    });

    document.getElementById("remezLink")?.addEventListener("click", (event) => {
      event.preventDefault();
      openLayer("remez");
    });

    document.getElementById("drashLink")?.addEventListener("click", (event) => {
      event.preventDefault();
      openLayer("drash");
    });

    document.getElementById("sodLink")?.addEventListener("click", (event) => {
      event.preventDefault();
      openLayer("sod");
    });

    document.getElementById("pardesVideoClose")?.addEventListener("click", closePanel);

    document.getElementById("pardesVideoPanel")?.addEventListener("click", (event) => {
      if(event.target?.id === "pardesVideoPanel"){
        closePanel();
      }
    });

    document.addEventListener("keydown", (event) => {
      if(event.key === "Escape"){
        closePanel();
      }
    });

    loadActiveAliyah();
  </script>

</body>
