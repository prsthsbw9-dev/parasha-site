<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>פרד״ס העליה</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *{ box-sizing:border-box; }

    html,body{
      min-height:100%;
      margin:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:#071014;
      color:#fff;
      overflow-x:hidden;
    }

    .sea-bg-video{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:0;
      background:#071014;
      transform:scale(1.04);
      pointer-events:none;
    }

    .sea-bg-overlay{
      position:fixed;
      inset:0;
      z-index:1;
      background:rgba(0,0,0,.16);
      pointer-events:none;
    }

    .page{
      position:relative;
      z-index:2;
      min-height:100vh;
      width:min(100%,560px);
      margin:0 auto;
      padding:20px 10px 34px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .gate-card{
      width:100%;
      position:relative;
    }

    .hero-logo{
      width:clamp(150px, 42vw, 225px);
      height:clamp(150px, 42vw, 225px);
      object-fit:cover;
      border-radius:50%;
      display:block;
      margin:0 auto 10px;
      border:2px solid rgba(255,255,255,.76);
      box-shadow:
        0 0 0 4px rgba(80,80,255,.32),
        0 0 34px rgba(255,255,255,.28),
        0 12px 32px rgba(0,0,0,.45);
    }

    .gate-title{
      margin:0 0 6px;
      font-size:clamp(36px, 9vw, 58px);
      font-weight:900;
      color:#fff;
      text-shadow:0 4px 18px rgba(0,0,0,.75);
      line-height:1.05;
    }

    .gate-subtitle{
      margin:0 auto 4px;
      font-size:clamp(17px, 4.5vw, 24px);
      line-height:1.55;
      font-weight:700;
      color:rgba(255,255,255,.96);
      text-shadow:0 3px 14px rgba(0,0,0,.72);
      max-width:430px;
    }

    .gate-note{
      font-size:clamp(14px, 3.6vw, 18px);
      color:rgba(255,255,255,.86);
    }

    .pardes-tree-wrap{
      position:relative;
      width:min(100%, 430px);
      height:458px;
      margin:10px auto 14px;
      direction:ltr;
      isolation:isolate;
    }

    .tree-head-info{
      position:absolute;
      z-index:6;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:190px;
      min-height:110px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      direction:rtl;
      pointer-events:none;
    }

    .active-parasha-title{
      min-height:22px;
      margin:0 0 8px;
      color:rgba(255,255,255,.96);
      font-size:clamp(16px, 4.2vw, 22px);
      font-weight:900;
      line-height:1.1;
      text-align:center;
      text-shadow:0 4px 16px rgba(0,0,0,.86), 0 0 14px rgba(180,220,255,.25);
      white-space:nowrap;
    }

    .main-aliyah-orb{
      pointer-events:auto;
      width:82px;
      height:82px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.78);
      color:#fff;
      background:
        radial-gradient(circle at 34% 26%, rgba(255,255,255,.88), rgba(255,255,255,.22) 18%, rgba(130,185,255,.18) 39%, rgba(20,34,62,.78) 68%, rgba(5,10,22,.92) 100%),
        conic-gradient(from 210deg, rgba(120,180,255,.12), rgba(255,255,255,.45), rgba(180,130,255,.18), rgba(120,180,255,.12));
      box-shadow:
        0 0 0 5px rgba(255,255,255,.08),
        0 0 20px rgba(195,225,255,.44),
        0 0 48px rgba(115,160,255,.24),
        0 14px 30px rgba(0,0,0,.42),
        inset 0 2px 0 rgba(255,255,255,.55),
        inset 0 -14px 24px rgba(0,0,0,.28);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:8px;
      cursor:pointer;
      transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .main-aliyah-orb::before{
      content:"";
      position:absolute;
      inset:-10px;
      border-radius:50%;
      border:1px solid rgba(210,230,255,.28);
      box-shadow:0 0 22px rgba(210,230,255,.20);
      pointer-events:none;
    }

    .main-aliyah-orb:hover{
      transform:translateY(-3px) scale(1.05);
      filter:brightness(1.08) saturate(1.10);
      box-shadow:
        0 0 0 8px rgba(255,255,255,.10),
        0 0 28px rgba(220,240,255,.62),
        0 0 62px rgba(135,180,255,.34),
        0 18px 36px rgba(0,0,0,.46),
        inset 0 2px 0 rgba(255,255,255,.72),
        inset 0 -14px 24px rgba(0,0,0,.28);
    }

    .main-aliyah-orb span{
      position:relative;
      z-index:2;
      display:block;
      color:#fff;
      font-size:17px;
      line-height:1.08;
      font-weight:900;
      text-shadow:0 3px 12px rgba(0,0,0,.86), 0 0 10px rgba(255,255,255,.34);
      direction:rtl;
    }

    .pardes-tree-svg{
      position:absolute;
      left:0;
      right:0;
      top:58px;
      bottom:auto;
      width:100%;
      height:100%;
      z-index:1;
      overflow:visible;
      pointer-events:none;
      filter:drop-shadow(0 10px 18px rgba(0,0,0,.25));
    }

    .pardes-tree-svg .tree-trunk{
      fill:none;
      stroke:rgba(210,175,130,.78);
      stroke-width:16;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .pardes-tree-svg .tree-trunk-light{
      fill:none;
      stroke:rgba(255,255,255,.30);
      stroke-width:4;
      stroke-linecap:round;
    }

    .pardes-tree-svg .tree-branch{
      fill:none;
      stroke:rgba(220,188,145,.68);
      stroke-width:7;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .pardes-tree-svg .tree-branch.thin{
      stroke:rgba(235,215,185,.42);
      stroke-width:3;
    }

    .pardes-tree-svg .tree-leaf{
      fill:rgba(86,185,138,.22);
      stroke:rgba(255,255,255,.26);
      stroke-width:1.3;
    }

    .pardes-tree-svg .tree-leaf-light{
      fill:rgba(255,255,255,.08);
      stroke:rgba(255,255,255,.20);
      stroke-width:1;
    }

    .fruit-link{
      position:absolute;
      z-index:3;
      width:72px;
      height:72px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-decoration:none;
      overflow:visible;
      background:
        radial-gradient(circle at 32% 22%, rgba(255,255,255,.92), rgba(255,255,255,.34) 18%, rgba(255,255,255,.07) 46%),
        radial-gradient(circle at 50% 72%, rgba(0,0,0,.18), rgba(0,0,0,.02) 62%);
      border:1px solid rgba(255,255,255,.72);
      box-shadow:
        0 0 0 6px rgba(255,255,255,.07),
        0 10px 25px rgba(0,0,0,.36),
        0 0 22px var(--fruit-glow, rgba(255,255,255,.28)),
        inset 0 2px 0 rgba(255,255,255,.55),
        inset 0 -10px 20px rgba(0,0,0,.14);
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
      transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
    }

    .fruit-link::before{
      content:"";
      position:absolute;
      top:-8px;
      right:17px;
      width:18px;
      height:11px;
      border-radius:100% 0 100% 0;
      background:linear-gradient(135deg, rgba(160,255,170,.95), rgba(38,150,72,.88));
      transform:rotate(-22deg);
      box-shadow:0 0 10px rgba(95,255,140,.32);
    }

    .fruit-link::after{
      content:"";
      position:absolute;
      inset:7px 10px auto auto;
      width:18px;
      height:18px;
      border-radius:50%;
      background:rgba(255,255,255,.35);
      filter:blur(1px);
      pointer-events:none;
    }

    .fruit-link:hover{
      transform:translateY(-5px) scale(1.08);
      filter:saturate(1.15) brightness(1.08);
      box-shadow:
        0 0 0 9px rgba(255,255,255,.09),
        0 15px 32px rgba(0,0,0,.42),
        0 0 30px var(--fruit-glow, rgba(255,255,255,.42)),
        0 0 56px var(--fruit-glow-soft, rgba(255,255,255,.20)),
        inset 0 2px 0 rgba(255,255,255,.70),
        inset 0 -12px 22px rgba(0,0,0,.16);
    }

    .pardes-fruit-icon{
      position:relative;
      z-index:2;
      font-size:36px;
      line-height:1;
      transform:translateY(-1px);
      text-shadow:
        0 3px 8px rgba(0,0,0,.38),
        0 0 14px rgba(255,255,255,.24);
    }

    .fruit-pshat{
      right:118px;
      top:122px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.95), rgba(255,185,170,.34) 18%, rgba(255,72,78,.88) 56%, rgba(145,12,24,.94) 100%);
      --fruit-glow:rgba(255,72,78,.62);
      --fruit-glow-soft:rgba(255,72,78,.26);
    }

    .fruit-remez{
      left:118px;
      top:122px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.95), rgba(220,190,255,.34) 18%, rgba(126,72,255,.90) 56%, rgba(52,22,132,.96) 100%);
      --fruit-glow:rgba(152,98,255,.68);
      --fruit-glow-soft:rgba(152,98,255,.28);
    }

    .fruit-drash{
      left:18px;
      top:192px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.95), rgba(255,226,158,.38) 18%, rgba(255,145,38,.92) 56%, rgba(145,67,4,.96) 100%);
      --fruit-glow:rgba(255,160,48,.70);
      --fruit-glow-soft:rgba(255,160,48,.30);
    }

    .fruit-sod{
      right:18px;
      top:192px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.98), rgba(255,250,180,.40) 18%, rgba(255,219,65,.94) 56%, rgba(155,110,0,.96) 100%);
      --fruit-glow:rgba(255,225,75,.72);
      --fruit-glow-soft:rgba(255,225,75,.32);
    }

    .fruit-whatsapp{
      left:34px;
      bottom:22px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.94), rgba(180,255,210,.34) 18%, rgba(37,211,102,.90) 56%, rgba(15,105,54,.96) 100%);
      --fruit-glow:rgba(37,211,102,.64);
      --fruit-glow-soft:rgba(37,211,102,.26);
    }

    .fruit-tikun{
      right:34px;
      bottom:22px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.96), rgba(190,235,255,.34) 18%, rgba(92,180,255,.84) 56%, rgba(23,82,145,.96) 100%);
      --fruit-glow:rgba(100,210,255,.62);
      --fruit-glow-soft:rgba(100,210,255,.26);
    }

    .fruit-email{
      left:125px;
      top:240px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.96), rgba(235,245,255,.36) 18%, rgba(110,165,245,.84) 56%, rgba(24,61,130,.96) 100%);
      --fruit-glow:rgba(120,190,255,.58);
      --fruit-glow-soft:rgba(120,190,255,.24);
    }

    .fruit-names{
      right:125px;
      top:240px;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.96), rgba(255,210,235,.36) 18%, rgba(230,88,160,.86) 56%, rgba(122,22,82,.96) 100%);
      --fruit-glow:rgba(255,110,185,.60);
      --fruit-glow-soft:rgba(255,110,185,.25);
    }

    .fruit-link i{
      position:relative;
      z-index:2;
      font-size:31px;
      line-height:1;
      color:#fff !important;
      text-shadow:
        0 3px 9px rgba(0,0,0,.42),
        0 0 13px rgba(255,255,255,.26);
    }



    .fig-icon{
      position:relative;
      z-index:2;
      width:38px;
      height:38px;
      display:inline-block;
      transform:translateY(-1px);
      filter:
        drop-shadow(0 3px 8px rgba(0,0,0,.38))
        drop-shadow(0 0 12px rgba(255,255,255,.18));
    }

    .fig-icon .fig-stem{
      position:absolute;
      top:2px;
      left:6px;
      width:12px;
      height:4px;
      background:linear-gradient(180deg,#8e6a44 0%,#6b4a26 100%);
      border-radius:4px;
      transform:rotate(-24deg);
      z-index:4;
      box-shadow:0 0 2px rgba(255,255,255,.12);
    }

    .fig-icon .fig-leaf{
      position:absolute;
      background:linear-gradient(180deg,#8ee96c 0%, #57bf3c 48%, #2f8730 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.34),
        0 0 7px rgba(125,255,120,.18);
      z-index:1;
    }

    .fig-icon .fig-leaf-left{
      top:1px;
      left:7px;
      width:24px;
      height:18px;
      border-radius:55% 45% 58% 42% / 62% 58% 42% 38%;
      transform:rotate(-8deg);
      clip-path:polygon(0% 56%, 10% 34%, 26% 22%, 42% 16%, 56% 6%, 72% 10%, 100% 24%, 84% 42%, 74% 56%, 92% 76%, 74% 76%, 60% 100%, 48% 82%, 34% 96%, 28% 76%, 8% 74%, 18% 58%);
    }

    .fig-icon .fig-leaf-right{
      top:8px;
      left:18px;
      width:20px;
      height:15px;
      border-radius:48% 52% 46% 54% / 54% 46% 54% 46%;
      transform:rotate(26deg);
      clip-path:polygon(0% 54%, 10% 32%, 28% 18%, 48% 8%, 68% 14%, 100% 30%, 82% 48%, 72% 58%, 88% 82%, 66% 76%, 54% 100%, 40% 80%, 24% 92%, 18% 74%, 0% 70%, 14% 56%);
    }

    .fig-icon .fig-fruit{
      position:absolute;
      left:9px;
      top:11px;
      width:21px;
      height:25px;
      background:
        radial-gradient(circle at 34% 24%, rgba(255,255,255,.78) 0%, rgba(255,255,255,.20) 10%, rgba(255,255,255,0) 18%),
        linear-gradient(180deg,#ba8aa6 0%, #986b8e 16%, #90658b 26%, #815276 46%, #7a466e 66%, #67325b 100%);
      border-radius:48% 48% 52% 52% / 34% 34% 66% 66%;
      z-index:3;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.35),
        inset 0 -3px 6px rgba(0,0,0,.16),
        0 0 9px rgba(202,140,190,.18);
      overflow:hidden;
    }

    .fig-icon .fig-fruit::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg, transparent 0%, rgba(240,215,182,.26) 22%, transparent 38%, rgba(240,215,182,.22) 52%, transparent 66%, rgba(240,215,182,.16) 80%, transparent 100%);
      opacity:.95;
    }

    .fig-icon .fig-fruit::after{
      content:"";
      position:absolute;
      bottom:2px;
      left:8px;
      width:5px;
      height:5px;
      border-radius:50%;
      background:rgba(240,220,180,.55);
      box-shadow:0 0 3px rgba(255,255,255,.18);
    }

    .fruit-logo-icon{
      position:relative;
      z-index:2;
      width:36px;
      height:36px;
      object-fit:cover;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.70);
      box-shadow:
        0 0 12px rgba(255,255,255,.28);
    }

    .fruit-letter{
      position:absolute;
      top:72px;
      left:50%;
      transform:translateX(-50%);
      color:#fff;
      font-size:18px;
      font-weight:900;
      line-height:1;
      text-shadow:0 3px 10px rgba(0,0,0,.85);
      pointer-events:none;
      white-space:nowrap;
    }

    .fruit-word{
      font-size:13px;
      min-width:80px;
      text-align:center;
    }



    .pardes-video-panel{
      position:fixed;
      inset:0;
      z-index:50;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(0,0,0,.62);
      backdrop-filter:blur(9px);
      -webkit-backdrop-filter:blur(9px);
    }

    .pardes-video-panel.is-open{
      display:flex;
    }

    .pardes-video-card{
      width:min(100%, 560px);
      border-radius:26px;
      border:1px solid rgba(255,255,255,.30);
      background:linear-gradient(180deg, rgba(7,16,20,.94), rgba(5,9,14,.90));
      box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 34px rgba(255,255,255,.10);
      overflow:hidden;
      text-align:right;
    }

    .pardes-video-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:14px 16px 10px;
    }

    .pardes-video-title{
      margin:0;
      font-size:19px;
      font-weight:900;
      line-height:1.35;
      color:#fff;
      text-shadow:0 3px 12px rgba(0,0,0,.65);
    }

    .pardes-video-close{
      width:38px;
      height:38px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.34);
      background:rgba(255,255,255,.10);
      color:#fff;
      font-size:26px;
      line-height:1;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(0,0,0,.25);
    }

    .pardes-video-body{
      padding:0 14px 16px;
    }

    .pardes-video-player{
      width:min(100%, 430px);
      max-height:min(76vh, 760px);
      aspect-ratio:9 / 16;
      margin:0 auto;
      border-radius:20px;
      background:#000;
      display:block;
      outline:none;
      object-fit:contain;
    }

    .pardes-video-player.is-horizontal{
      width:100%;
      max-height:62vh;
      aspect-ratio:16 / 9;
    }

    .pardes-video-player.is-square{
      width:min(100%, 520px);
      max-height:70vh;
      aspect-ratio:1 / 1;
    }

    .pardes-video-empty{
      display:none;
      padding:26px 18px;
      border-radius:20px;
      border:1px dashed rgba(255,255,255,.30);
      background:rgba(255,255,255,.08);
      color:rgba(255,255,255,.92);
      font-size:16px;
      line-height:1.65;
      text-align:center;
    }

    .pardes-search-row{
      margin:8px auto 0;
      width:min(100%, 480px);
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.24);
      background:rgba(0,0,0,.20);
      color:rgba(255,255,255,.92);
      box-shadow:0 10px 24px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      direction:rtl;
      text-shadow:0 2px 10px rgba(0,0,0,.7);
    }

    .pardes-search-icon{
      font-size:22px;
      line-height:1;
      filter:drop-shadow(0 0 8px rgba(120,190,255,.45));
    }

    .pardes-search-row label{
      font-size:15px;
      font-weight:900;
      white-space:nowrap;
    }

    .pardes-search-row input{
      width:130px;
      min-height:34px;
      border-radius:4px;
      border:2px solid rgba(255,255,255,.78);
      background:rgba(2,5,14,.86);
      color:#fff;
      padding:6px 8px;
      font-size:15px;
      outline:none;
      text-align:center;
    }

    .pardes-search-row input::placeholder{
      color:rgba(255,255,255,.48);
    }

    .pardes-search-row button{
      min-height:34px;
      border:1px solid rgba(255,255,255,.28);
      border-radius:999px;
      padding:6px 13px;
      color:#fff;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      background:linear-gradient(135deg, rgba(45,165,255,.95), rgba(135,92,255,.95));
      box-shadow:0 8px 18px rgba(0,0,0,.28), 0 0 18px rgba(120,170,255,.22);
    }

    .pardes-search-message{
      width:min(100%, 430px);
      min-height:18px;
      margin:6px auto 0;
      color:rgba(255,255,255,.82);
      font-size:13px;
      font-weight:800;
      text-shadow:0 2px 10px rgba(0,0,0,.75);
    }

    .secret-admin-hit{
      position:absolute;
      left:8px;
      bottom:8px;
      width:34px;
      height:34px;
      opacity:0;
      z-index:20;
    }


    @media (max-width:640px){
      .pardes-video-panel{
        padding:10px;
        align-items:center;
      }

      .pardes-video-card{
        width:100%;
        max-height:94vh;
        border-radius:22px;
      }

      .pardes-video-head{
        padding:12px 12px 8px;
      }

      .pardes-video-title{
        font-size:16px;
      }

      .pardes-video-body{
        padding:0 10px 12px;
      }

      .pardes-video-player{
        width:min(100%, 420px);
        max-height:calc(100dvh - 92px);
        border-radius:18px;
      }

      .pardes-video-player.is-horizontal{
        width:100%;
        max-height:calc(100dvh - 130px);
      }
    }

    @media (max-width:420px){

      .page{
        padding:14px 8px 24px;
      }

      .pardes-tree-wrap{
        height:430px;
        width:min(100%, 390px);
        margin-top:4px;
        margin-bottom:12px;
      }

      .tree-head-info{
        top:0;
        width:168px;
      }

      .active-parasha-title{
        margin-bottom:7px;
      }

      .main-aliyah-orb{

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDtrEyAnVMhCZWnSaUYut9LxNC17C3So1Y",
      authDomain: "parasha-site-links.firebaseapp.com",
      projectId: "parasha-site-links",
      storageBucket: "parasha-site-links.firebasestorage.app",
      messagingSenderId: "799400165769",
      appId: "1:799400165769:web:1b5cf70eee80e772df6158"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const layerNames = {
      main: "העלייה הראשית",
      pshat: "פשט",
      remez: "רמז",
      drash: "דרש",
      sod: "סוד"
    };

    let currentParasha = "";
    let currentAliyah = "";
    let currentParashaKey = "";
    let currentAliyahKey = "";
    let activeVideos = {};

    function makeSafeKey(value){
      return String(value || "")
        .trim()
        .replace(/[\\/#?%&.\[\]*]/g, "-")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function videoDocId(parashaKey, aliyahKey){
      return `${parashaKey}_${aliyahKey}`;
    }

    function setSearchMessage(text){
      const box = document.getElementById("pardesSearchMessage");
      if(!box) return;
      box.textContent = text || "";
    }

    function setTreeHead(parasha, aliyah){
      const parashaTitle = document.getElementById("activeParashaTitle");
      const orbText = document.getElementById("mainAliyahOrbText");
      const orb = document.getElementById("mainAliyahOrb");
      const parashaSearchInput = document.getElementById("parashaSearchInput");
      const aliyahSearchInput = document.getElementById("aliyahSearchInput");

      if(parashaTitle){
        parashaTitle.textContent = parasha ? `פרשת ${parasha}` : "פרשת השבוע";
      }

      if(orbText){
        const shownAliyah = aliyah || "עלייה פעילה";
        const parts = String(shownAliyah).trim().split(/\s+/);
        orbText.innerHTML = parts.length > 1 ? `${parts[0]}<br>${parts.slice(1).join(" ")}` : shownAliyah;
      }

      if(orb){
        orb.setAttribute("aria-label", aliyah ? `פתיחת הסרטון הראשי של ${aliyah} בפרשת ${parasha}` : "פתיחת הסרטון הראשי של העלייה");
      }

      if(parashaSearchInput && !parashaSearchInput.value){ parashaSearchInput.value = parasha || ""; }
      if(aliyahSearchInput && !aliyahSearchInput.value){ aliyahSearchInput.value = aliyah || ""; }
    }

    function hasAnyLayerVideo(data){
      if(!data) return false;
      return ["main", "pshat", "remez", "drash", "sod"].some((layer) => {
        const item = data[layer];
        return !!(
          item?.mobile?.url ||
          item?.wide?.url ||
          item?.mobileUrl ||
          item?.wideUrl ||
          item?.url
        );
      });
    }

    async function loadActiveAliyah(){
      try{
        const currentRef = doc(db, "links", "current");
        const currentSnap = await getDoc(currentRef);

        if(!currentSnap.exists()){
          setTreeHead("", "");
          setSearchMessage("");
          return;
        }

        const current = currentSnap.data();

        currentParasha = current.currentParasha || current.parasha || "";
        currentAliyah = current.currentAliyah || current.aliyah || "";
        currentParashaKey = current.currentParashaKey || makeSafeKey(currentParasha);
        currentAliyahKey = current.currentAliyahKey || makeSafeKey(currentAliyah);

        const whatsappLink = document.getElementById("whatsappLink");
        if(whatsappLink){ whatsappLink.href = current.whatsapp || "#"; }

        setTreeHead(currentParasha, currentAliyah);

        if(!currentParasha || !currentAliyah){
          setSearchMessage("");
          activeVideos = {};
          return;
        }

        const videosRef = doc(db, "aliyahVideos", videoDocId(currentParashaKey, currentAliyahKey));
        const videosSnap = await getDoc(videosRef);

        activeVideos = videosSnap.exists() ? videosSnap.data() : {};

        if(!hasAnyLayerVideo(activeVideos)){
          setSearchMessage("עדיין לא הועלו סרטונים לעלייה הזו.");
          return;
        }

        setSearchMessage(`מוצג עכשיו: פרשת ${currentParasha} — ${currentAliyah}`);
      }catch(error){
        console.error("שגיאה בטעינת העלייה הפעילה:", error);
        setSearchMessage("לא הצלחתי לטעון את העלייה הפעילה כרגע.");
      }
    }


    async function loadSpecificAliyah(parasha, aliyah, options = {}){
      const parashaKey = makeSafeKey(parasha);
      const aliyahKey = makeSafeKey(aliyah);

      if(!parashaKey || !aliyahKey){
        throw new Error("נא להזין גם שם פרשה וגם שם עלייה.");
      }

      currentParasha = String(parasha || "").trim();
      currentAliyah = String(aliyah || "").trim();
      currentParashaKey = parashaKey;
      currentAliyahKey = aliyahKey;
      setTreeHead(currentParasha, currentAliyah);

      const videosRef = doc(db, "aliyahVideos", videoDocId(parashaKey, aliyahKey));
      const videosSnap = await getDoc(videosRef);
      activeVideos = videosSnap.exists() ? videosSnap.data() : {};

      if(options.saveLocal !== false){
        localStorage.setItem("pardesSearchParasha", currentParasha);
        localStorage.setItem("pardesSearchAliyah", currentAliyah);
      }

      if(hasAnyLayerVideo(activeVideos)){
        setSearchMessage(`מוצג עכשיו: פרשת ${currentParasha} — ${currentAliyah}`);
      }else{
        setSearchMessage(`לא נמצאו עדיין סרטונים שמורים עבור פרשת ${currentParasha} — ${currentAliyah}.`);
      }
    }

    function isMobileViewer(){
      return window.matchMedia("(max-width: 700px), (pointer: coarse)").matches;
    }

    function chooseVideoForViewer(item){
      if(!item) return null;

      const mobile = item.mobile?.url ? item.mobile : (
        item.mobileUrl ? {
          url: item.mobileUrl,
          storagePath: item.mobileStoragePath,
          fileName: item.mobileFileName,
          contentType: item.mobileContentType
        } : null
      );

      const wide = item.wide?.url ? item.wide : (
        item.wideUrl ? {
          url: item.wideUrl,
          storagePath: item.wideStoragePath,
          fileName: item.wideFileName,
          contentType: item.wideContentType
        } : null
      );

      if(isMobileViewer()){
        return mobile || wide || (item.url ? item : null);
      }

      return wide || mobile || (item.url ? item : null);
    }

    let videoSessionId = 0;

    function stopPardesVideo(){
      videoSessionId += 1;

      const player = document.getElementById("pardesVideoPlayer");
      if(!player) return;

      player.onloadedmetadata = null;
      player.oncanplay = null;
      player.onplay = null;
      player.autoplay = false;

      try{
        player.pause();
      }catch(error){}

      try{
        player.currentTime = 0;
      }catch(error){}

      player.removeAttribute("src");
      player.src = "";

      while(player.firstChild){
        player.removeChild(player.firstChild);
      }

      try{
        player.load();
      }catch(error){}

      player.classList.remove("is-horizontal", "is-square");
      player.style.visibility = "visible";
    }

    function openLayer(layer){
      stopPardesVideo();

      const panel = document.getElementById("pardesVideoPanel");
      const title = document.getElementById("pardesVideoTitle");
      const player = document.getElementById("pardesVideoPlayer");
      const empty = document.getElementById("pardesVideoEmpty");

      const item = activeVideos?.[layer];
      const layerName = layerNames[layer] || "פרד״ס";
      const currentSession = videoSessionId;

      if(title){
        title.textContent = `${layerName} — פרשת ${currentParasha || ""} ${currentAliyah || ""}`.trim();
      }

      const selectedVideo = chooseVideoForViewer(item);

      if(selectedVideo?.url){
        empty.style.display = "none";
        player.style.display = "block";
        player.classList.remove("is-horizontal", "is-square");
        player.style.visibility = "hidden";
        player.muted = false;
        player.autoplay = true;
        player.playsInline = true;
        player.setAttribute("playsinline", "");
        player.setAttribute("webkit-playsinline", "");
        player.preload = "auto";
        player.src = selectedVideo.url;

        player.onloadedmetadata = () => {
          if(currentSession !== videoSessionId) return;

          const ratio = player.videoWidth && player.videoHeight
            ? player.videoWidth / player.videoHeight
            : 9 / 16;

          player.classList.remove("is-horizontal", "is-square");

          if(ratio > 1.2){
            player.classList.add("is-horizontal");
          }else if(ratio > 0.82 && ratio < 1.2){
            player.classList.add("is-square");
          }

          player.style.visibility = "visible";
        };

        panel.classList.add("is-open");
        panel.setAttribute("aria-hidden", "false");

        player.load();

        const playPromise = player.play();
        if(playPromise && typeof playPromise.catch === "function"){
          playPromise.catch(() => {
            if(currentSession !== videoSessionId || !panel.classList.contains("is-open")) return;

            player.muted = true;
            player.play().catch(() => {
              if(currentSession !== videoSessionId || !panel.classList.contains("is-open")) return;

              player.muted = false;
              player.style.visibility = "visible";
            });
          });
        }
      }else{
        stopPardesVideo();
        player.style.display = "none";
        empty.style.display = "block";
        empty.innerHTML = `עדיין לא הועלה סרטון <b>${layerName}</b> עבור העלייה הפעילה.`;

        panel.classList.add("is-open");
        panel.setAttribute("aria-hidden", "false");
      }
    }

    function closePanel(){
      const panel = document.getElementById("pardesVideoPanel");
      stopPardesVideo();
      panel.classList.remove("is-open");
      panel.setAttribute("aria-hidden", "true");
    }

    document.getElementById("mainAliyahOrb")?.addEventListener("click", (event) => {
      event.preventDefault();
      openLayer("main");
    });

    document.getElementById("pshatLink")?.addEventListener("click", (event) => {
      event.preventDefault();
      openLayer("pshat");
    });

    document.getElementById("remezLink")?.addEventListener("click", (event) => {
      event.preventDefault();
      openLayer("remez");
    });

    document.getElementById("drashLink")?.addEventListener("click", (event) => {
      event.preventDefault();
      openLayer("drash");
    });

    document.getElementById("sodLink")?.addEventListener("click", (event) => {
      event.preventDefault();
      openLayer("sod");
    });

    document.getElementById("pardesSearchForm")?.addEventListener("submit", async (event) => {
      event.preventDefault();
      const parasha = document.getElementById("parashaSearchInput")?.value || "";
      const aliyah = document.getElementById("aliyahSearchInput")?.value || "";

      try{
        setSearchMessage("מחפש את העלייה...");
        await loadSpecificAliyah(parasha, aliyah);
      }catch(error){
        console.error("שגיאה בחיפוש העלייה:", error);
        setSearchMessage(error?.message || "לא הצלחתי למצוא את העלייה המבוקשת.");
      }
    });

    document.getElementById("pardesVideoClose")?.addEventListener("click", closePanel);

    document.getElementById("pardesVideoPanel")?.addEventListener("click", (event) => {
      if(event.target?.id === "pardesVideoPanel"){
        closePanel();
      }
    });

    document.addEventListener("keydown", (event) => {
      if(event.key === "Escape"){
        closePanel();
      }
    });

    window.addEventListener("pagehide", stopPardesVideo);
    window.addEventListener("beforeunload", stopPardesVideo);
    document.addEventListener("visibilitychange", () => {
      if(document.hidden){
        stopPardesVideo();
        document.getElementById("pardesVideoPanel")?.classList.remove("is-open");
        document.getElementById("pardesVideoPanel")?.setAttribute("aria-hidden", "true");
      }
    });

    loadActiveAliyah();
  </script>
